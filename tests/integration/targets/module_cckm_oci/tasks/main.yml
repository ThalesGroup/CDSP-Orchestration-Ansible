# ---------------------------------------------------------------------------

- name: "List tenancies"
  thalesgroup.ciphertrust.cckm_oci_tenancy_info:
    localNode: "{{ this_node_connection_string }}"
    op_type: list
  register: _list_tenancy

- name: Verify listing tenancies answered with a collection
  ansible.builtin.assert:
    that:
      - _list_tenancy is not failed
      - _list_tenancy is not changed
      - _list_tenancy.response is defined
    fail_msg: >-
      Listing tenancies failed -- {{ _list_tenancy.msg | default('') }}

