#
# Two halves, as the AWS, Azure and Google Cloud targets have. The read-only
# half needs a licensed CipherTrust Manager but no OCI tenancy, and is what
# catches a module that cannot reach its own endpoint -- including the one
# OCI path CCKM serves with a trailing slash.

- name: Give this run a unique suffix
  ansible.builtin.set_fact:
    run_suffix: "{{ 99999999 | random }}"

- name: Verify integration_config was supplied
  ansible.builtin.assert:
    that:
      - this_node_connection_string is defined
    fail_msg: "cm_connection_string must be set in integration_config.yml"

# The CCKM licence gate is per endpoint, and which endpoints it covers differs
# per cloud: for OCI it is the tenancy collection that is refused on an
# unlicensed manager, while listing keys is not -- the opposite of the Google
# Cloud service. Probe the gated one, or the probe passes and the target fails
# later.
- name: "Probe whether CCKM is licensed on this manager"
  thalesgroup.ciphertrust.cckm_oci_tenancy_info:
    localNode: "{{ this_node_connection_string }}"
    op_type: list
  register: _cckm_probe
  ignore_errors: true

- name: Decide whether this target can run here
  ansible.builtin.set_fact:
    _can_run: >-
      {{ _cckm_probe is not failed
         or 'License' not in (_cckm_probe.msg | default('')) }}

- name: Explain why this target is being skipped
  ansible.builtin.debug:
    msg: >-
      Skipping module_cckm_oci: CipherTrust Manager reports the CCKM licence
      is not installed, so every CCKM endpoint answers 403. Install the CCKM
      licence to run this target.
  when: not _can_run

- name: End the play when CCKM is not licensed
  ansible.builtin.meta: end_play
  when: not _can_run

