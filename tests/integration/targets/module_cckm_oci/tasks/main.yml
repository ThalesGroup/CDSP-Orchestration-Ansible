# ---------------------------------------------------------------------------
# Argument validation. These need no OCI tenancy.
# ---------------------------------------------------------------------------

- name: Negative test - a key create with no parameters must be rejected
  thalesgroup.ciphertrust.cckm_oci_key: {}
  register: _negative_key
  ignore_errors: true

- name: Assert the key module names its missing arguments
  ansible.builtin.assert:
    that:
      - _negative_key is failed
      - >-
        "missing required arguments" in (_negative_key.msg | default(""))
    fail_msg: >-
      Expected cckm_oci_key to reject an empty task, got --
      {{ _negative_key.msg | default("no message") }}

- name: Negative test - an unknown OCI key algorithm must be rejected
  thalesgroup.ciphertrust.cckm_oci_key:
    localNode: "{{ this_node_connection_string }}"
    op_type: create
    vault: "ansible-absent-{{ run_suffix }}"
    name: "ansible-{{ run_suffix }}"
    algorithm: BLOWFISH
    length: 32
    protection_mode: HSM
    compartment_id: "ocid1.compartment.oc1..absent"
  register: _negative_algo
  ignore_errors: true

- name: Assert the algorithm is rejected by the argument spec
  ansible.builtin.assert:
    that:
      - _negative_algo is failed
      - >-
        "must be one of" in (_negative_algo.msg | default(""))
    fail_msg: >-
      Expected an unsupported algorithm to be rejected, got --
      {{ _negative_algo.msg | default("no message") }}

- name: Negative test - scheduling a deletion without days must be rejected
  thalesgroup.ciphertrust.cckm_oci_key:
    localNode: "{{ this_node_connection_string }}"
    op_type: schedule_deletion
    key_id: "ansible-absent-{{ run_suffix }}"
  register: _negative_days
  ignore_errors: true

- name: Assert the deferred deletion requires a day count
  ansible.builtin.assert:
    that:
      - _negative_days is failed
      - >-
        "missing required arguments" in (_negative_days.msg | default(""))
    fail_msg: >-
      OCI deletion is scheduled, so days is required. Got --
      {{ _negative_days.msg | default("no message") }}

- name: "Create a key in check mode against a vault that does not exist"
  thalesgroup.ciphertrust.cckm_oci_key:
    localNode: "{{ this_node_connection_string }}"
    op_type: create
    vault: "ansible-absent-{{ run_suffix }}"
    name: "ansible-check-{{ run_suffix }}"
    algorithm: AES
    length: 32
    protection_mode: HSM
    compartment_id: "ocid1.compartment.oc1..absent"
  check_mode: true
  register: _check_key

- name: Verify check mode predicted a change
  ansible.builtin.assert:
    that:
      - _check_key is not failed
      - _check_key is changed

- name: "Look for the key check mode claimed it would create"
  thalesgroup.ciphertrust.cckm_oci_key_info:
    localNode: "{{ this_node_connection_string }}"
    op_type: list
    key_name: "ansible-check-{{ run_suffix }}"
  register: _check_absent

- name: Verify check mode wrote nothing
  ansible.builtin.assert:
    that:
      - _check_absent is not failed
      - (_check_absent.response.resources | default([])) | length == 0
    fail_msg: "check mode created the key it only predicted"

# ---------------------------------------------------------------------------
# Live half. Needs an OCI tenancy reachable through a connection.
# ---------------------------------------------------------------------------

- name: "Exercise the live OCI path"
  when: cckm_oci_run_live | default(false) | bool
  block:
    - name: "Read the regions the tenancy subscribes to"
      thalesgroup.ciphertrust.cckm_oci_tenancy_info:
        localNode: "{{ this_node_connection_string }}"
        op_type: regions
        connection: "{{ cckm_oci_connection_name }}"
      register: _regions

    - name: Verify regions were read
      ansible.builtin.assert:
        that:
          - _regions is not failed
          - _regions is not changed

    - name: "Discover the compartments the connection can reach"
      thalesgroup.ciphertrust.cckm_oci_compartment_info:
        localNode: "{{ this_node_connection_string }}"
        op_type: available
        connection: "{{ cckm_oci_connection_name }}"
      register: _compartments

    - name: Verify compartments were discovered
      ansible.builtin.assert:
        that:
          - _compartments is not failed
          - _compartments is not changed
