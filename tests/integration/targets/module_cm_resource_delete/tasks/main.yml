# Deletes a resource by key. The module targets <collection>/<key>; a bug that
# sent the request to the bare collection endpoint instead went unnoticed from
# 1.0.2, so this asserts the resource is really gone afterwards.

- name: Verify integration_config was supplied
  ansible.builtin.assert:
    that:
      - cm_connection_string is defined
    fail_msg: "cm_connection_string must be set in integration_config.yml"

- name: Name this run's resources
  ansible.builtin.set_fact:
    run_suffix: "{{ 99999999 | random }}"

- name: Create a key to delete
  thalesgroup.ciphertrust.vault_keys2_save:
    localNode: "{{ this_node_connection_string }}"
    op_type: create
    name: "AnsibleIntegrationTest_Delete_{{ run_suffix }}"
    algorithm: aes
    size: 256
    usageMask: 3145740
  register: _key

- name: Delete the key by id
  thalesgroup.ciphertrust.cm_resource_delete:
    localNode: "{{ this_node_connection_string }}"
    resource_type: keys
    key: "{{ _key.response.id }}"
  register: _delete

- name: The delete succeeded and reported a change
  ansible.builtin.assert:
    that:
      - _delete is not failed
      - _delete is changed
    fail_msg: "Failed to delete the key"
    success_msg: "Key deleted"

- name: Look the deleted key up again
  thalesgroup.ciphertrust.cm_resource_get_id_from_name:
    localNode: "{{ this_node_connection_string }}"
    resource_type: keys
    query_param: name
    query_param_value: "AnsibleIntegrationTest_Delete_{{ run_suffix }}"
  register: _after_delete
  ignore_errors: true

- name: The key is really gone
  ansible.builtin.assert:
    that:
      - _after_delete is failed
    fail_msg: >-
      The key still resolves after deletion, so the delete did not target the
      resource it was asked to remove.
    success_msg: "Deleted resource no longer resolves"

- name: Delete the same key again
  thalesgroup.ciphertrust.cm_resource_delete:
    localNode: "{{ this_node_connection_string }}"
    resource_type: keys
    key: "{{ _key.response.id }}"
  register: _delete_again

- name: Deleting something already gone is not a change
  ansible.builtin.assert:
    that:
      - _delete_again is not failed
      - _delete_again is not changed
    fail_msg: >-
      A repeated delete should report changed=false rather than failing or
      claiming a change; got changed={{ _delete_again.changed | default('?') }}
      {{ _delete_again.msg | default('') }}
    success_msg: "Repeated delete is a no-op"

- name: Delete without supplying a key
  thalesgroup.ciphertrust.cm_resource_delete:
    localNode: "{{ this_node_connection_string }}"
    resource_type: keys
  register: _no_key
  ignore_errors: true

- name: A delete without a key is refused
  ansible.builtin.assert:
    that:
      - _no_key is failed
      - "'key' in _no_key.msg"
    fail_msg: "Expected cm_resource_delete to refuse a missing key"
    success_msg: "Missing key refused before any request was sent"

# Negative test - required params validation
- name: Negative test - missing required parameters should fail
  thalesgroup.ciphertrust.cm_resource_delete: {}
  register: _negative_required_params_result
  ignore_errors: true

- name: Assert negative test failed as expected
  ansible.builtin.assert:
    that:
      - _negative_required_params_result is failed
      - >-
        "missing required arguments" in
        (_negative_required_params_result.msg | default(""))
    fail_msg: >-
      Expected the module to reject a task with no parameters and name the
      missing arguments, got: {{ _negative_required_params_result.msg | default("no message") }}
    success_msg: "Module rejects a task with no parameters"
