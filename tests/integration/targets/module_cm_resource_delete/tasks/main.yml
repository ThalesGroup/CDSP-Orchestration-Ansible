---
# Integration test for cm_resource_delete module
# Tests resource deletion operations

- name: Set connection parameters
  ansible.builtin.set_fact:
    connection_string: "{{ lookup('env', 'CIPHERTRUST_CONNECTION_STRING') | default('localhost:8200', true) }}"
    username: "{{ lookup('env', 'CIPHERTRUST_USERNAME') | default('admin', true) }}"
    password: "{{ lookup('env', 'CIPHERTRUST_PASSWORD') | default('Thales123', true) }}"
    api_key: "{{ lookup('env', 'CIPHERTRUST_API_KEY') | default('', true) }}"
    domain: "{{ lookup('env', 'CIPHERTRUST_DOMAIN') | default('', true) }}"
    verify_ssl: "{{ lookup('env', 'CIPHERTRUST_VERIFY_SSL') | default('false', true) }}"

- name: Get resource ID for deletion test
  thalesgroup.ciphertrust.cm_resource_get_id_from_name:
    connection_string: "{{ connection_string }}"
    username: "{{ username }}"
    password: "{{ password }}"
    api_key: "{{ api_key }}"
    domain: "{{ domain }}"
    verify_ssl: "{{ verify_ssl }}"
    resource_type: "keys"
    resource_name: "test_key_for_deletion"
  register: resource_id_result
  ignore_errors: true

- name: Delete resource if ID is available
  thalesgroup.ciphertrust.cm_resource_delete:
    connection_string: "{{ connection_string }}"
    username: "{{ username }}"
    password: "{{ password }}"
    api_key: "{{ api_key }}"
    domain: "{{ domain }}"
    verify_ssl: "{{ verify_ssl }}"
    resource_id: "{{ resource_id_result.response.id if resource_id_result is succeeded else 'test_resource_id' }}"
    resource_type: "keys"
  register: delete_result
  when: resource_id_result is succeeded or resource_id_result is failed
  ignore_errors: true

- name: Verify resource deletion
  ansible.builtin.assert:
    that:
      - delete_result is succeeded or delete_result is failed
    fail_msg: "Failed to test resource deletion"
    success_msg: "Successfully tested resource deletion"

- name: Display deletion result
  ansible.builtin.debug:
    var: delete_result.response

# Negative test - required params validation
- name: Negative test - missing required parameters should fail
  thalesgroup.ciphertrust.cm_resource_delete: {}
  register: _negative_required_params_result
  ignore_errors: true

- name: Assert negative test failed as expected
  ansible.builtin.assert:
    that:
      - _negative_required_params_result is failed
    fail_msg: "Expected module to fail when required parameters are missing"
    success_msg: "Negative path validated for missing required parameters"

# Negative test - API error handling
- name: Negative test - API error should fail for unreachable CM
  thalesgroup.ciphertrust.cm_services:
    connection_string: "127.0.0.1:1"
    username: "admin"
    password: "invalid-password"
    verify_ssl: false
    op_type: "get"
  register: _negative_api_error_result
  ignore_errors: true

- name: Assert API error negative test failed as expected
  ansible.builtin.assert:
    that:
      - _negative_api_error_result is failed
    fail_msg: "Expected API request to fail when CipherTrust Manager is unreachable"
    success_msg: "Negative API error path validated"
