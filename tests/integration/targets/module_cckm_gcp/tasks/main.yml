      - _list_key_ring is not changed
      - _list_key_ring.response is defined
    fail_msg: >-
      Listing key rings failed -- {{ _list_key_ring.msg | default('') }}

- name: "List keys"
  thalesgroup.ciphertrust.cckm_gcp_key_info:
