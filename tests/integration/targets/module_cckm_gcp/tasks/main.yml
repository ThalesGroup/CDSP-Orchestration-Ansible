#
# Two halves, as the AWS and Azure targets have:
#
#   * Unconditional -- the read-only modules, argument validation and check
#     mode. These need a licensed CipherTrust Manager but no Google Cloud
#     project, and they are what catches a module that cannot reach its own
#     endpoint. That matters more here than for the other clouds: CCKM serves
#     Google Cloud under cckm/google, not cckm/gcp, so a wrong root would 404
#     on every call.
#   * Guarded by cckm_gcp_run_live -- discovery against a real Google Cloud
#     project. Off by default.

- name: Give this run a unique suffix
  ansible.builtin.set_fact:
    run_suffix: "{{ 99999999 | random }}"

- name: Verify integration_config was supplied
  ansible.builtin.assert:
    that:
      - this_node_connection_string is defined
    fail_msg: "cm_connection_string must be set in integration_config.yml"

# The licence gate is per endpoint, not per service: an unlicensed manager
# still answers the projects and key-rings collections but refuses the keys
# collection with 403. Probe the gated one, or the probe passes and the target
# fails later.
- name: "Probe whether CCKM is licensed on this manager"
  thalesgroup.ciphertrust.cckm_gcp_key_info:
    localNode: "{{ this_node_connection_string }}"
    op_type: list
  register: _cckm_probe
  ignore_errors: true

- name: Decide whether this target can run here
  ansible.builtin.set_fact:
    _can_run: >-
      {{ _cckm_probe is not failed
         or 'License' not in (_cckm_probe.msg | default('')) }}

- name: Explain why this target is being skipped
  ansible.builtin.debug:
    msg: >-
      Skipping module_cckm_gcp: CipherTrust Manager reports the CCKM licence
      is not installed, so every CCKM endpoint answers 403. Install the CCKM
      licence to run this target.
  when: not _can_run

- name: End the play when CCKM is not licensed
  ansible.builtin.meta: end_play
  when: not _can_run

# ---------------------------------------------------------------------------
# Reads. A manager with no CCKM Google Cloud resources must answer with an
# empty collection, not an error.
# ---------------------------------------------------------------------------

- name: "List projects"
  thalesgroup.ciphertrust.cckm_gcp_project_info:
    localNode: "{{ this_node_connection_string }}"
    op_type: list
  register: _list_project

- name: Verify listing projects answered with a collection
  ansible.builtin.assert:
    that:
      - _list_project is not failed
      - _list_project is not changed
      - _list_project.response is defined
    fail_msg: >-
      Listing projects failed -- {{ _list_project.msg | default('') }}

- name: "List key rings"
  thalesgroup.ciphertrust.cckm_gcp_key_ring_info:
    localNode: "{{ this_node_connection_string }}"
    op_type: list
  register: _list_key_ring

- name: Verify listing key rings answered with a collection
  ansible.builtin.assert:
