      - _list_sync.response is defined
    fail_msg: >-
      Listing synchronisation jobs failed -- {{ _list_sync.msg | default('') }}

# ---------------------------------------------------------------------------
# Argument validation. These need no Google Cloud project.
# ---------------------------------------------------------------------------

- name: Negative test - a key create with no parameters must be rejected
  thalesgroup.ciphertrust.cckm_gcp_key: {}
  register: _negative_key
  ignore_errors: true

- name: Assert the key module names its missing arguments
  ansible.builtin.assert:
    that:
      - _negative_key is failed
      - >-
        "missing required arguments" in (_negative_key.msg | default(""))
    fail_msg: >-
      Expected cckm_gcp_key to reject an empty task, got --
      {{ _negative_key.msg | default("no message") }}

- name: Negative test - an unknown Cloud KMS algorithm must be rejected
  thalesgroup.ciphertrust.cckm_gcp_key:
    localNode: "{{ this_node_connection_string }}"
    op_type: create
    key_ring: "ansible-absent-{{ run_suffix }}"
    gcp_key_params:
      key_name: "ansible-{{ run_suffix }}"
      algorithm: AES_256_GCM
      purpose: ENCRYPT_DECRYPT
      protection_level: SOFTWARE
  register: _negative_algo
  ignore_errors: true

- name: Assert the algorithm is rejected by the argument spec
  ansible.builtin.assert:
    that:
      - _negative_algo is failed
      - >-
        "must be one of" in (_negative_algo.msg | default(""))
    fail_msg: >-
      Expected an unsupported algorithm to be rejected, got --
      {{ _negative_algo.msg | default("no message") }}

- name: Negative test - an unknown bulk version operation must be rejected
  thalesgroup.ciphertrust.cckm_gcp_update_all_versions_job:
    localNode: "{{ this_node_connection_string }}"
    op_type: start
    key_id: "ansible-absent-{{ run_suffix }}"
    operation: purge
  register: _negative_bulk
  ignore_errors: true

- name: Assert the bulk operation is rejected by the argument spec
  ansible.builtin.assert:
    that:
      - _negative_bulk is failed
      - >-
        "must be one of" in (_negative_bulk.msg | default(""))
    fail_msg: >-
      Expected an unsupported operation to be rejected, got --
      {{ _negative_bulk.msg | default("no message") }}

- name: "Create a key in check mode against a key ring that does not exist"
  thalesgroup.ciphertrust.cckm_gcp_key:
    localNode: "{{ this_node_connection_string }}"
    op_type: create
    key_ring: "ansible-absent-{{ run_suffix }}"
    gcp_key_params:
      key_name: "ansible-check-{{ run_suffix }}"
      algorithm: GOOGLE_SYMMETRIC_ENCRYPTION
      purpose: ENCRYPT_DECRYPT
      protection_level: SOFTWARE
  check_mode: true
  register: _check_key

- name: Verify check mode predicted a change
  ansible.builtin.assert:
    that:
      - _check_key is not failed
      - _check_key is changed
    fail_msg: >-
      Check mode should report the create it would perform. Result --
      changed={{ _check_key.changed | default('?') }},
      msg={{ _check_key.msg | default('') }}

- name: "Look for the key check mode claimed it would create"
  thalesgroup.ciphertrust.cckm_gcp_key_info:
    localNode: "{{ this_node_connection_string }}"
    op_type: list
    name: "ansible-check-{{ run_suffix }}"
  register: _check_absent

- name: Verify check mode wrote nothing
  ansible.builtin.assert:
    that:
      - _check_absent is not failed
      - (_check_absent.response.resources | default([])) | length == 0
    fail_msg: "check mode created the key it only predicted"

# ---------------------------------------------------------------------------
# Live half. Needs a Google Cloud project reachable through a connection.
# ---------------------------------------------------------------------------

- name: "Exercise the live Google Cloud path"
  when: cckm_gcp_run_live | default(false) | bool
  block:
    - name: "Discover the projects the connection can reach"
      thalesgroup.ciphertrust.cckm_gcp_project_info:
        localNode: "{{ this_node_connection_string }}"
        op_type: available
        connection: "{{ cckm_gcp_connection_name }}"
      register: _projects

    - name: Verify projects were discovered
      ansible.builtin.assert:
        that:
          - _projects is not failed
          - _projects is not changed

    - name: "List the Cloud KMS locations in the project"
      thalesgroup.ciphertrust.cckm_gcp_project_info:
        localNode: "{{ this_node_connection_string }}"
        op_type: locations
        project_id: "{{ cckm_gcp_project_id }}"
        connection: "{{ cckm_gcp_connection_name }}"
      register: _locations

    - name: Verify locations were discovered
      ansible.builtin.assert:
        that:
          - _locations is not failed
          - _locations is not changed
