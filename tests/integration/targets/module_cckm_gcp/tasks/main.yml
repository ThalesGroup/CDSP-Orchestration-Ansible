      - _list_key is not failed
      - _list_key is not changed
      - _list_key.response is defined
    fail_msg: >-
      Listing keys failed -- {{ _list_key.msg | default('') }}

- name: "List reports"
  thalesgroup.ciphertrust.cckm_gcp_report_info:
