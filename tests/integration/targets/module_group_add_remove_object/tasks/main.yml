# # Verify that integration_config was specified
- block:
    - assert:
        that:
          - this_node_connection_string is defined
          - group1_name is defined
          - group1_description is defined
          - user1_name is defined
          - user1_email is defined
          - user1_password is defined

- block:
    - name: "Create Test Group"
      thalesgroup.ciphertrust.group_save:
        op_type: create
        name: "{{ group1_name }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_create_group

    - assert:
        that:
          - _result_create_group is not failed
          - _result_create_group.response.id is string

    - name: "Create Test User"
      thalesgroup.ciphertrust.usermgmt_users_save:
        op_type: create
        name: "{{ user1_name }}"
        email: "{{ user1_email }}"
        password: "{{ user1_password }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_create_user

    - assert:
        that:
          - _result_create_user is not failed
          - _result_create_user.response.id is string

    - name: "Add User to Group"
      thalesgroup.ciphertrust.group_add_remove_object:
        op_type: add
        object_type: user
        object_id: "{{ _result_create_user.response.id }}"
        name: "{{ group1_name }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_add_user_to_group

    - assert:
        that:
          - _result_add_user_to_group is not failed
          - _result_add_user_to_group.response.id is string

    - name: "Remove User from Group"
      thalesgroup.ciphertrust.group_add_remove_object:
        op_type: remove
        object_type: user
        object_id: "{{ _result_create_user.response.id }}"
        name: "{{ group1_name }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_remove_user_from_group

    - assert:
        that:
          - _result_remove_user_from_group is not failed
          - _result_remove_user_from_group.response.id is string

    - name: "Cleanup - Remove User from Group (if still present)"
      thalesgroup.ciphertrust.group_add_remove_object:
        op_type: remove
        object_type: user
        object_id: "{{ _result_create_user.response.id }}"
        name: "{{ group1_name }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_cleanup_remove
      ignore_errors: true

    # usermgmt_users_save has no delete operation; users are removed through
    # cm_resource_delete.
    - name: "Cleanup - Delete Test User"
      thalesgroup.ciphertrust.cm_resource_delete:
        localNode: "{{ this_node_connection_string }}"
        resource_type: users
        key: "{{ _result_create_user.response.id }}"
      register: _result_cleanup_user
      failed_when: false

    # The collection has no delete path for groups, so the test group is left
    # behind deliberately rather than pretending to remove it. Adding a group
    # delete would let this be cleaned up properly.
    - name: "Cleanup - note the group that cannot be removed"
      ansible.builtin.debug:
        msg: >-
          Group {{ group1_name }} remains on the CipherTrust Manager: this
          collection has no group delete operation.

# Negative test - required params validation
- name: Negative test - missing required parameters should fail
  thalesgroup.ciphertrust.group_add_remove_object: {}
  register: _negative_required_params_result
  ignore_errors: true

- name: Assert negative test failed as expected
  ansible.builtin.assert:
    that:
      - _negative_required_params_result is failed
      - >-
        "missing required arguments" in
        (_negative_required_params_result.msg | default(""))
    fail_msg: >-
      Expected the module to reject a task with no parameters and name the
      missing arguments, got: {{ _negative_required_params_result.msg | default("no message") }}
    success_msg: "Module rejects a task with no parameters"
