# # Verify that integration_config was specified
- name: Verify integration_config was supplied
  block:
    - name: Verify integration_config was supplied
      ansible.builtin.assert:
        that:
          - this_node_connection_string is defined

# Transparent Encryption is separately licensed. Without the licence
# CipherTrust Manager answers the CTE client endpoints with 403, which would
# report as a broken module rather than an unlicensed manager. Probe once and
# skip with an explanation, as the other licence-dependent targets do.
- name: Give this probe a unique name
  ansible.builtin.set_fact:
    _cte_probe_name: "cte-licence-probe-{{ 99999999 | random }}"

# CipherTrust Manager gates Transparent Encryption on the licence for writes
# only -- a GET on the clients collection succeeds without it -- so the probe
# has to attempt a write. Creating a client needs nothing but a name, and
# nothing is created when the licence is missing, so this leaves no residue.
- name: "Probe whether Transparent Encryption is licensed on this manager"
  thalesgroup.ciphertrust.cte_client:
    localNode: "{{ this_node_connection_string }}"
    op_type: create
    name: "{{ _cte_probe_name }}"
  register: _cte_probe
  ignore_errors: true

- name: Decide whether this target can run here
  ansible.builtin.set_fact:
    _can_run: >-
      {{ 'License' not in (_cte_probe.msg | default('')) }}

- name: "Remove the probe client when the manager is licensed"
  thalesgroup.ciphertrust.cte_client:
    localNode: "{{ this_node_connection_string }}"
    op_type: delete_id
    id: "{{ _cte_probe.response.id }}"
  when:
    - _can_run
    - _cte_probe is not failed
    - _cte_probe.response.id is defined
  failed_when: false

- name: Explain why this target is being skipped
  ansible.builtin.debug:
    msg: >-
      Skipping: CipherTrust Manager reports the TransparentEncryption licence
      is not installed, so writes to the CTE endpoints answer 403. Install the
      CTE licence to run this target.
  when: not _can_run

- name: End the play when Transparent Encryption is not licensed
  ansible.builtin.meta: end_play
  when: not _can_run

# # Validate the CTE Client module
- name: Get User ID from Name
  block:
    - name: "Get User ID from Name"
      thalesgroup.ciphertrust.cm_resource_get_id_from_name:
        localNode: "{{ this_node_connection_string }}"
        query_param: username
        query_param_value: "{{ username }}"
        resource_type: users
      register: user

    - name: "Create Key"
      thalesgroup.ciphertrust.vault_keys2_save:
        op_type: create
        name: "{{ key_name }}"
        algorithm: "{{ key_algo }}"
        size: "{{ key_size }}"
        undeletable: false
        unexportable: false
        usageMask: 76
        meta:
          ownerId: "{{ user['response']['id'] }}"
          permissions:
            DecryptWithKey:
              - "CTE Clients"
            EncryptWithKey:
              - "CTE Clients"
            ExportKey:
              - "CTE Clients"
            MACVerifyWithKey:
              - "CTE Clients"
            MACWithKey:
              - "CTE Clients"
            ReadKey:
              - "CTE Clients"
            SignVerifyWithKey:
              - "CTE Clients"
            SignWithKey:
              - "CTE Clients"
            UseKey:
              - "CTE Clients"
          cte:
            persistent_on_client: true
            encryption_mode: CBC
            cte_versioned: false
        xts: false
        localNode: "{{ this_node_connection_string }}"
      register: key

    - name: "Create CTE ResourceSet"
      thalesgroup.ciphertrust.cte_resource_set:
        op_type: create
        name: "{{ resource_set }}"
        type: Directory
        description: "Created via Ansible"
        resources:
          - directory: "{{ resource_set_dir_path }}"
            file: "*"
            include_subfolders: true
            hdfs: false
        localNode: "{{ this_node_connection_string }}"
      register: _result_create_rs

    - name: "Create CTE Policy"
      thalesgroup.ciphertrust.cte_policy_save:
        op_type: create
        localNode: "{{ this_node_connection_string }}"
        name: "{{ cte_policy_name }}"
        description: "Created via Ansible"
        never_deny: false
        metadata:
          restrict_update: false
        security_rules:
          - action: key_op
            effect: "permit,applykey"
            partial_match: true
          - resource_set_id: "{{ _result_create_rs['response']['id'] }}"
            exclude_resource_set: false
            partial_match: true
            action: all_ops
            effect: "permit,audit,applykey"
        policy_type: Standard
        key_rules:
          - key_id: "{{ key['response']['id'] }}"
            resource_set_id: "{{ _result_create_rs['response']['id'] }}"
        data_transform_rules:
          - key_id: "{{ key['response']['id'] }}"
            resource_set_id: "{{ _result_create_rs['response']['id'] }}"
      register: _result_policy_create

    - name: "Create CTE Client"
      thalesgroup.ciphertrust.cte_client:
        op_type: create
        name: "CTE-Client-Ansible"
        description: "Created via Ansible"
        communication_enabled: false
        client_type: FS
        password_creation_method: GENERATE
        user_space_client: true
        localNode: "{{ this_node_connection_string }}"
      register: _result_client_create

    - name: Verify create CTE Client
      ansible.builtin.assert:
        that:
          - _result_client_create is not failed
          - _result_client_create.response.id is string

    - name: "Patch Client"
      thalesgroup.ciphertrust.cte_client:
        op_type: patch
        id: "{{ _result_client_create['response']['id'] }}"
        registration_allowed: true
        description: "Updated via Ansible"
        enabled_capabilities: LDT
        localNode: "{{ this_node_connection_string }}"
      register: _result_patch

    - name: Verify patch Client
      ansible.builtin.assert:
        that:
          - _result_patch is not failed
          - _result_patch.response.id is defined
    - name: "Add Guard Points to the CTE Client"
      thalesgroup.ciphertrust.cte_client:
        op_type: add_guard_point
        id: "{{ _result_client_create['response']['id'] }}"
        guard_paths:
          - "/opt/path1/"
        guard_point_params:
          guard_point_type: directory_auto
          policy_id: "{{ _result_policy_create['response']['id'] }}"
          automount_enabled: true
        localNode: "{{ this_node_connection_string }}"
      register: _result_add_gp

    - name: Verify add Guard Points to the CTE Client
      ansible.builtin.assert:
        that:
          - _result_add_gp is not failed
          - _result_add_gp.response.id is defined
    - name: "Patch Guard Point in CTE Client"
      thalesgroup.ciphertrust.cte_client:
        localNode: "{{ this_node_connection_string }}"
        op_type: patch_guard_point
        id: "{{ _result_client_create['response']['id'] }}"
        gp_id: "{{ _result_add_gp['response']['id'] }}"
        guard_enabled: true
      register: _result_update_gp

    - name: Verify patch Guard Point in CTE Client
      ansible.builtin.assert:
        that:
          - _result_update_gp is not failed

    - name: "Enable early access on GuardPoint"
      thalesgroup.ciphertrust.cte_client:
        localNode: "{{ this_node_connection_string }}"
        op_type: gp_enable_early_access
        id: "{{ _result_client_create['response']['id'] }}"
        gp_id: "{{ _result_add_gp['response']['id'] }}"
        early_access: true
      register: _result_update_gp_enable_early_access

    - name: Verify enable early access on GuardPoint
      ansible.builtin.assert:
        that:
          - _result_update_gp_enable_early_access is not failed

    - name: "UnGuard the guard point"
      thalesgroup.ciphertrust.cte_client:
        localNode: "{{ this_node_connection_string }}"
        op_type: gp_unguard
        id: "{{ _result_client_create['response']['id'] }}"
        guard_point_id_list:
          - "{{ _result_add_gp['response']['id'] }}"
      register: _result_unguard

    - name: Verify unGuard the guard point
      ansible.builtin.assert:
        that:
          - _result_unguard is not failed

    - name: "Send LDT Suspend Request to CTE Client"
      thalesgroup.ciphertrust.cte_client:
        op_type: ldt_pause
        id: "{{ _result_client_create['response']['id'] }}"
        localNode: "{{ this_node_connection_string }}"
        paused: true
      register: _result_ldt_pause

    - name: Verify send LDT Suspend Request to CTE Client
      ansible.builtin.assert:
        that:
          - _result_ldt_pause is not failed

    - name: "Un-enroll CTE Client"
      thalesgroup.ciphertrust.cte_client:
        op_type: unenroll
        name: "CTE-Client-Ansible"
        localNode: "{{ this_node_connection_string }}"
      register: _result_unenroll

    - name: Verify un-enroll CTE Client
      ansible.builtin.assert:
        that:
          - _result_unenroll is not failed

    - name: "Delete a CTE Client with ID"
      thalesgroup.ciphertrust.cte_client:
        op_type: delete_id
        id: "{{ _result_client_create['response']['id'] }}"
        del_client: true
        force_del_client: true
        localNode: "{{ this_node_connection_string }}"
      register: _result_delete

    - name: Verify delete a CTE Client with ID
      ansible.builtin.assert:
        that:
          - _result_delete is not failed

    - name: "Delete CTE Policy"
      thalesgroup.ciphertrust.cm_resource_delete:
        key: "{{ _result_policy_create.response.id }}"
        resource_type: "cte-policy"
        localNode: "{{ this_node_connection_string }}"
      register: _result_delete_policy

    - name: Verify delete CTE Policy
      ansible.builtin.assert:
        that:
          - _result_delete_policy is not failed

    - name: Pause for 1 minute
      ansible.builtin.pause:
        minutes: 1
      when: _result_delete is succeeded

    - name: "Delete Resource Set"
      thalesgroup.ciphertrust.cm_resource_delete:
        key: "{{ _result_create_rs.response.id }}"
        resource_type: "resourceset"
        localNode: "{{ this_node_connection_string }}"
      register: _result_delete_resource_set

    - name: Verify delete Resource Set
      ansible.builtin.assert:
        that:
          - _result_delete_resource_set is not failed

    - name: "Delete Key"
      thalesgroup.ciphertrust.cm_resource_delete:
        key: "{{ key['response']['id'] }}"
        resource_type: "keys"
        localNode: "{{ this_node_connection_string }}"
      register: _result_delete_key

    - name: Verify delete Key
      ansible.builtin.assert:
        that:
          - _result_delete_key is not failed

# Negative test - required params validation
- name: Negative test - missing required parameters should fail
  thalesgroup.ciphertrust.cte_client: {}
  register: _negative_required_params_result
  ignore_errors: true

- name: Assert negative test failed as expected
  ansible.builtin.assert:
    that:
      - _negative_required_params_result is failed
      - >-
        "missing required arguments" in
        (_negative_required_params_result.msg | default(""))
    fail_msg: >-
      Expected the module to reject a task with no parameters and name the
      missing arguments, got: {{ _negative_required_params_result.msg | default("no message") }}
    success_msg: "Module rejects a task with no parameters"
