---
this_node_connection_string: "{{ cm_connection_string }}"

# Per-run, so the target exercises a real create rather than matching a key
# an earlier run left behind.
key_name: "AnsibleIntegrationTest_Key_{{ run_suffix }}"
# 2048 is an RSA size. CipherTrust Manager accepts only 128, 192 or 256
# for AES.
key_algo: aes
key_len: 256
usage_mask: 12
# A key revoked as KeyCompromise cannot be reactivated; use a reason that
# deactivates it so the reactivate step below is a valid transition.
key_revocation_reason: Superseded
key_revocation_message: "Via Ansible Integration Test"
key_reactivation_reason: DeactivatedToActive
key_reactivation_message: "Via Ansible Integration Test"
