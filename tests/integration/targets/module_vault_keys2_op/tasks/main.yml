# # Verify that integration_config was specified
- name: Give this run a unique suffix
  ansible.builtin.set_fact:
    run_suffix: "{{ 99999999 | random }}"

- name: Verify integration_config was supplied
  block:
    - name: Verify integration_config was supplied
      ansible.builtin.assert:
        that:
          - this_node_connection_string is defined
          - key_name is defined
          - key_algo is defined
          - key_len is defined
          - usage_mask is defined
          - key_revocation_reason is defined
          - key_revocation_message is defined
          - key_reactivation_reason is defined
          - key_reactivation_message is defined

# # Validate the create user module
- name: Create Key
  block:
    - name: "Create Key"
      thalesgroup.ciphertrust.vault_keys2_save:
        op_type: create
        name: "{{ key_name }}"
        algorithm: "{{ key_algo }}"
        size: "{{ key_len }}"
        usageMask: "{{ usage_mask }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_create

    - name: Verify create Key
      ansible.builtin.assert:
        that:
          - _result_create is not failed
          - _result_create.response.id is string

    - name: "Save key ID"
      ansible.builtin.set_fact:
        key_id: "{{ _result_create.response.id }}"

    - name: "Patch Key"
      thalesgroup.ciphertrust.vault_keys2_save:
        op_type: "patch"
        cm_key_id: "{{ key_id }}"
        unexportable: false
        localNode: "{{ this_node_connection_string }}"
      register: _result_patch

    - name: Verify patch Key
      ansible.builtin.assert:
        that:
          - _result_patch is not failed
          - _result_patch.response.id is defined
    - name: "Create Version"
      thalesgroup.ciphertrust.vault_keys2_save:
        op_type: create_version
        cm_key_id: "{{ key_id }}"
        encoding: "base64"
        localNode: "{{ this_node_connection_string }}"
      register: _result_create_version

    - name: Verify create Version
      ansible.builtin.assert:
        that:
          - _result_create_version is not failed
          - _result_create_version.response.id is defined
    - name: "Archive Key"
      thalesgroup.ciphertrust.vault_keys2_op:
        op_type: archive
        cm_key_id: "{{ key_id }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_archive

    - name: Verify archive Key
      ansible.builtin.assert:
        that:
          - _result_archive is not failed
          - _result_archive.response.id is defined
    - name: "Recover Key"
      thalesgroup.ciphertrust.vault_keys2_op:
        op_type: recover
        cm_key_id: "{{ key_id }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_recover

    - name: Verify recover Key
      ansible.builtin.assert:
        that:
          - _result_recover is not failed
          - _result_recover.response.id is defined
    - name: "Revoke Key"
      thalesgroup.ciphertrust.vault_keys2_op:
        op_type: revoke
        cm_key_id: "{{ key_id }}"
        reason: "{{ key_revocation_reason }}"
        messageStr: "{{ key_revocation_message }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_revoke

    - name: Verify revoke Key
      ansible.builtin.assert:
        that:
          - _result_revoke is not failed

    - name: "Reactivate Key"
      thalesgroup.ciphertrust.vault_keys2_op:
        op_type: reactivate
        cm_key_id: "{{ key_id }}"
        reason: "{{ key_reactivation_reason }}"
        messageStr: "{{ key_reactivation_message }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_reactivate

    - name: Verify reactivate Key
      ansible.builtin.assert:
        that:
          - _result_reactivate is not failed
          - _result_reactivate.response.id is defined
    - name: "Revoke Key again so it can be destroyed"
      thalesgroup.ciphertrust.vault_keys2_op:
        op_type: revoke
        cm_key_id: "{{ key_id }}"
        reason: "{{ key_revocation_reason }}"
        messageStr: "{{ key_revocation_message }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_revoke_again

    - name: Verify revoke Key again so it can be destroyed
      ansible.builtin.assert:
        that:
          - _result_revoke_again is not failed

    - name: "Destroy Key"
      thalesgroup.ciphertrust.vault_keys2_op:
        op_type: destroy
        cm_key_id: "{{ key_id }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_destroy

    - name: Verify destroy Key
      ansible.builtin.assert:
        that:
          - _result_destroy is not failed
          - _result_destroy.response.id is defined
    - name: "Delete Key"
      thalesgroup.ciphertrust.cm_resource_delete:
        key: "{{ key_id }}"
        resource_type: "keys"
        localNode: "{{ this_node_connection_string }}"
      register: _result_delete

    - name: Verify delete Key
      ansible.builtin.assert:
        that:
          - _result_delete is not failed

# Negative test - required params validation
- name: Negative test - missing required parameters should fail
  thalesgroup.ciphertrust.vault_keys2_op: {}
  register: _negative_required_params_result
  ignore_errors: true

- name: Assert negative test failed as expected
  ansible.builtin.assert:
    that:
      - _negative_required_params_result is failed
      - >-
        "missing required arguments" in
        (_negative_required_params_result.msg | default(""))
    fail_msg: >-
      Expected the module to reject a task with no parameters and name the
      missing arguments, got: {{ _negative_required_params_result.msg | default("no message") }}
    success_msg: "Module rejects a task with no parameters"
