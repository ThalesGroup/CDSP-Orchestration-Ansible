azure_client_secret: "placeholder-azure-client-secret"
# CipherTrust Manager parses the service-account JSON and requires a
# private_key inside it, so the placeholder has to be a complete
# service-account document rather than a stub. Folded across lines to stay
# within the line-length limit; the folding only inserts spaces between JSON
# tokens.
