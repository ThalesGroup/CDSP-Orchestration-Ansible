#
# The idempotency contract, asserted against a real CipherTrust Manager.
#
# Running a task a second time against unchanged state must report
# changed=false and must not issue a write. The unit suite asserts this with a
# faked client; only these tests prove it against CM's real responses, which is
# where the field names the comparison depends on actually come from.
#
# Resources are named with a per-run suffix so the target is re-runnable even
# if a previous run failed before its cleanup, and every resource is removed in
# an always: block. Only resource types this collection can delete are used --
# there is no delete path for groups, so group_save is not exercised here.

- name: Verify integration_config was supplied
  ansible.builtin.assert:
    that:
      - cm_connection_string is defined
    fail_msg: "cm_connection_string must be set in integration_config.yml"

- name: Name this run's resources
  ansible.builtin.set_fact:
    run_suffix: "{{ 99999999 | random }}"

- name: Derive resource names
  ansible.builtin.set_fact:
    idem_key_name: "AnsibleIntegrationTest_Idem_Key_{{ run_suffix }}"
    idem_char_set_name: "AnsibleIntegrationTest_Idem_CharSet_{{ run_suffix }}"

# --------------------------------------------------------------------------
# vault_keys2_save -- create, re-create, no-op patch, real patch
# --------------------------------------------------------------------------

- name: Key lifecycle is idempotent
  block:
    - name: Create a key
      thalesgroup.ciphertrust.vault_keys2_save:
        localNode: "{{ this_node_connection_string }}"
        op_type: create
        name: "{{ idem_key_name }}"
        algorithm: aes
        size: 256
        usageMask: 3145740
      register: _key_first

    - name: The first run creates the key
      ansible.builtin.assert:
        that:
          - _key_first is changed
          - _key_first.response.id is defined

    - name: Save the key id
      ansible.builtin.set_fact:
        idem_key_id: "{{ _key_first.response.id }}"

    - name: Create the same key again
      thalesgroup.ciphertrust.vault_keys2_save:
        localNode: "{{ this_node_connection_string }}"
        op_type: create
        name: "{{ idem_key_name }}"
        algorithm: aes
        size: 256
        usageMask: 3145740
      register: _key_second

    - name: The second run makes no change
      ansible.builtin.assert:
        that:
          - _key_second is not changed
        fail_msg: >-
          vault_keys2_save reported changed for a key that already exists; the
          GET-before-write lookup did not match it back.

    - name: Create the key again in check mode
      thalesgroup.ciphertrust.vault_keys2_save:
        localNode: "{{ this_node_connection_string }}"
        op_type: create
        name: "{{ idem_key_name }}"
        algorithm: aes
        size: 256
        usageMask: 3145740
      check_mode: true
      register: _key_check

    - name: Check mode agrees with the real run
      ansible.builtin.assert:
        that:
          - _key_check is not changed
        fail_msg: "check mode predicted a change for a key that already exists"

    - name: Patch the key with the value it already has
      thalesgroup.ciphertrust.vault_keys2_save:
        localNode: "{{ this_node_connection_string }}"
        op_type: patch
        cm_key_id: "{{ idem_key_id }}"
        unexportable: false
      register: _key_patch_noop

    - name: A patch that changes nothing reports no change
      ansible.builtin.assert:
        that:
          - _key_patch_noop is not changed
        fail_msg: >-
          patch reported changed while sending the current state; the resource
          identifier is probably being compared as though it were a field.

    - name: Patch the key with a new value
      thalesgroup.ciphertrust.vault_keys2_save:
        localNode: "{{ this_node_connection_string }}"
        op_type: patch
        cm_key_id: "{{ idem_key_id }}"
        unexportable: true
      register: _key_patch_real

    - name: A patch that changes something reports changed
      ansible.builtin.assert:
        that:
          - _key_patch_real is changed

  always:
    - name: Remove the key
      thalesgroup.ciphertrust.cm_resource_delete:
        localNode: "{{ this_node_connection_string }}"
        resource_type: keys
        key: "{{ idem_key_id | default(idem_key_name) }}"
      register: _key_cleanup
      failed_when: false

    - name: Report cleanup that did not succeed
      ansible.builtin.debug:
        msg: >-
          Key {{ idem_key_name }} may need removing by hand:
          {{ _key_cleanup.msg | default('') }}
      when: _key_cleanup is failed

# --------------------------------------------------------------------------
# dpg_character_set_save -- create, re-create
# --------------------------------------------------------------------------

- name: Character set lifecycle is idempotent
  block:
    - name: Create a character set
      thalesgroup.ciphertrust.dpg_character_set_save:
        localNode: "{{ this_node_connection_string }}"
        op_type: create
        name: "{{ idem_char_set_name }}"
        range:
          - "0-1F"
        encoding: "UTF-8"
      register: _cs_first

    - name: The first run creates the character set
      ansible.builtin.assert:
        that:
          - _cs_first is changed
          - _cs_first.response.id is defined

    - name: Save the character set id
      ansible.builtin.set_fact:
        idem_char_set_id: "{{ _cs_first.response.id }}"

    - name: Create the same character set again
      thalesgroup.ciphertrust.dpg_character_set_save:
        localNode: "{{ this_node_connection_string }}"
        op_type: create
        name: "{{ idem_char_set_name }}"
        range:
          - "0-1F"
        encoding: "UTF-8"
      register: _cs_second

    - name: The second run makes no change
      ansible.builtin.assert:
        that:
          - _cs_second is not changed

  always:
    - name: Remove the character set
      thalesgroup.ciphertrust.cm_resource_delete:
        localNode: "{{ this_node_connection_string }}"
        resource_type: character-sets
        key: "{{ idem_char_set_id | default(idem_char_set_name) }}"
      register: _cs_cleanup
      failed_when: false

# --------------------------------------------------------------------------
# A name containing URL metacharacters must be handled, not mangled
# --------------------------------------------------------------------------

- name: Resource names needing percent-encoding are handled
  block:
    - name: Create a key whose name needs percent-encoding
      thalesgroup.ciphertrust.vault_keys2_save:
        localNode: "{{ this_node_connection_string }}"
        op_type: create
        name: "AnsibleIntegrationTest Idem&Key {{ run_suffix }}"
        algorithm: aes
        size: 256
        usageMask: 3145740
      register: _encoded_first

    - name: The key is created despite the space and ampersand
      ansible.builtin.assert:
        that:
          - _encoded_first is changed
          - _encoded_first.response.id is defined
        fail_msg: >-
          A resource name containing a space or '&' was not handled; the
          request URL is probably not being encoded.

    - name: Look the same key up again
      thalesgroup.ciphertrust.vault_keys2_save:
        localNode: "{{ this_node_connection_string }}"
        op_type: create
        name: "AnsibleIntegrationTest Idem&Key {{ run_suffix }}"
        algorithm: aes
        size: 256
        usageMask: 3145740
      register: _encoded_second

    - name: The lookup matches the encoded name back
      ansible.builtin.assert:
        that:
          - _encoded_second is not changed
        fail_msg: >-
          The GET-before-write lookup did not match a name containing a space
          or '&', so the query string is not being encoded correctly.

  always:
    - name: Remove the encoded-name key
      thalesgroup.ciphertrust.cm_resource_delete:
        localNode: "{{ this_node_connection_string }}"
        resource_type: keys
        key: "{{ _encoded_first.response.id | default('') }}"
      when: _encoded_first.response.id is defined
      failed_when: false
