#
# Creates a client registration token and patches it.
#
# The collection has no delete path for registration tokens, so this creates
# one token per run with a unique prefix rather than leaving a shared object
# behind. Tokens expire on their own; if a test system accumulates them, they
# can be removed from the CipherTrust Manager console.

- name: Verify integration_config was supplied
  ansible.builtin.assert:
    that:
      - cm_connection_string is defined
    fail_msg: "cm_connection_string must be set in integration_config.yml"

- name: Name this run's resources
  ansible.builtin.set_fact:
    run_suffix: "{{ 99999999 | random }}"

- name: Create a registration token
  thalesgroup.ciphertrust.cm_regtoken:
    localNode: "{{ this_node_connection_string }}"
    op_type: create
    name_prefix: "AnsibleIntegrationTest_{{ run_suffix }}"
    label: "AnsibleIntegrationTest_{{ run_suffix }}"
    lifetime: "30d"
    max_clients: 5
  register: _token

- name: The token was created
  ansible.builtin.assert:
    that:
      - _token is not failed
      - _token is changed
      - _token.response.id is defined
    fail_msg: "Failed to create a registration token"
    success_msg: "Registration token created"

- name: Patch the token with a new client limit
  thalesgroup.ciphertrust.cm_regtoken:
    localNode: "{{ this_node_connection_string }}"
    op_type: patch
    id: "{{ _token.response.id }}"
    max_clients: 10
  register: _patch_real

- name: The patch reported a change
  ansible.builtin.assert:
    that:
      - _patch_real is not failed
      - _patch_real is changed
    fail_msg: "Expected the client limit change to be applied"
    success_msg: "Registration token patched"

- name: Patch the token with the value it now has
  thalesgroup.ciphertrust.cm_regtoken:
    localNode: "{{ this_node_connection_string }}"
    op_type: patch
    id: "{{ _token.response.id }}"
    max_clients: 10
  register: _patch_noop

- name: Re-applying the same value makes no change
  ansible.builtin.assert:
    that:
      - _patch_noop is not changed
    fail_msg: >-
      patch reported changed while sending the current state; the resource
      identifier is probably being compared as though it were a field.
    success_msg: "Registration token patch is idempotent"

# Negative test - required params validation
- name: Negative test - missing required parameters should fail
  thalesgroup.ciphertrust.cm_regtoken: {}
  register: _negative_required_params_result
  ignore_errors: true

- name: Assert negative test failed as expected
  ansible.builtin.assert:
    that:
      - _negative_required_params_result is failed
      - >-
        "missing required arguments" in
        (_negative_required_params_result.msg | default(""))
    fail_msg: >-
      Expected the module to reject a task with no parameters and name the
      missing arguments, got: {{ _negative_required_params_result.msg | default("no message") }}
    success_msg: "Module rejects a task with no parameters"
