# cm_services only supports op_type: restart, which interrupts the CipherTrust
# Manager under test and every task that follows. The restart is therefore
# opt-in: set cm_allow_disruptive_tests to run it. By default this asserts the
# check-mode contract, which exercises the module without touching the server.

- name: Verify integration_config was supplied
  ansible.builtin.assert:
    that:
      - cm_connection_string is defined
    fail_msg: "cm_connection_string must be set in integration_config.yml"

- name: Predict a service restart without performing it
  thalesgroup.ciphertrust.cm_services:
    localNode: "{{ this_node_connection_string }}"
    op_type: restart
    services:
      - nae
  check_mode: true
  register: _restart_check

- name: Check mode reports the change it would make
  ansible.builtin.assert:
    that:
      - _restart_check is not failed
      - _restart_check is changed
    fail_msg: "Expected check mode to predict changed=true for a restart"
    success_msg: "Restart predicted in check mode without contacting the server"

- name: Restart services
  thalesgroup.ciphertrust.cm_services:
    localNode: "{{ this_node_connection_string }}"
    op_type: restart
    services:
      - nae
    delay: 5
  register: _restart
  when: cm_allow_disruptive_tests | default(false) | bool

- name: The restart was accepted
  ansible.builtin.assert:
    that:
      - _restart is not failed
      - _restart is changed
    fail_msg: "Service restart failed"
    success_msg: "Service restart accepted"
  when: cm_allow_disruptive_tests | default(false) | bool

# Negative test - required params validation
- name: Negative test - missing required parameters should fail
  thalesgroup.ciphertrust.cm_services: {}
  register: _negative_required_params_result
  ignore_errors: true

- name: Assert negative test failed as expected
  ansible.builtin.assert:
    that:
      - _negative_required_params_result is failed
      - >-
        "missing required arguments" in
        (_negative_required_params_result.msg | default(""))
    fail_msg: >-
      Expected the module to reject a task with no parameters and name the
      missing arguments, got: {{ _negative_required_params_result.msg | default("no message") }}
    success_msg: "Module rejects a task with no parameters"
