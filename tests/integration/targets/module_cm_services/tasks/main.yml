---
# Integration test for cm_services module
# Tests service management operations

- name: Set connection parameters
  ansible.builtin.set_fact:
    connection_string: "{{ lookup('env', 'CIPHERTRUST_CONNECTION_STRING') | default('localhost:8200', true) }}"
    username: "{{ lookup('env', 'CIPHERTRUST_USERNAME') | default('admin', true) }}"
    password: "{{ lookup('env', 'CIPHERTRUST_PASSWORD') | default('Thales123', true) }}"
    api_key: "{{ lookup('env', 'CIPHERTRUST_API_KEY') | default('', true) }}"
    domain: "{{ lookup('env', 'CIPHERTRUST_DOMAIN') | default('', true) }}"
    verify_ssl: "{{ lookup('env', 'CIPHERTRUST_VERIFY_SSL') | default('false', true) }}"

- name: Get service information
  thalesgroup.ciphertrust.cm_services:
    connection_string: "{{ connection_string }}"
    username: "{{ username }}"
    password: "{{ password }}"
    api_key: "{{ api_key }}"
    domain: "{{ domain }}"
    verify_ssl: "{{ verify_ssl }}"
    op_type: "get"
  register: services_result

- name: Verify service information
  ansible.builtin.assert:
    that:
      - services_result is succeeded
      - services_result is not failed
      - services_result.response is defined
    fail_msg: "Failed to get service information"
    success_msg: "Successfully retrieved service information"

- name: Display service information
  ansible.builtin.debug:
    var: services_result.response
