####################################################################
# WARNING: These are designed specifically for Ansible tests       #
# and should not be used as examples of how to write Ansible roles #
####################################################################

## Verify that integration_config was specified
- block:
  - assert:
      that:
        - this_node_connection_string is defined
        - char_set_name is defined
        - char_set_encoding is defined
        - char_set_range is defined
        - updated_char_set_range is defined

- block:
  - name: "Create CharSet"
    thalesgroup.ciphertrust.dpg_character_set_save:
      op_type: create
      name: "{{ char_set_name }}"
      range: "{{ char_set_range }}"
      localNode: "{{ this_node_connection_string }}"
      encoding: "{{ char_set_encoding }}"
    register: _result_create

  - assert:
      that:
        - _result_create is not failed
        - _result_create.response.id is string

  - name: "Save charset ID"
    set_fact:
      char_set_id: "{{ _result_create.response.id }}"

  - name: "Patch CharSet"
    thalesgroup.ciphertrust.dpg_character_set_save:
      op_type: patch
      char_set_id: "{{ char_set_id }}"
      range: "{{ updated_char_set_range }}"
      localNode: "{{ this_node_connection_string }}"
    register: _result_patch

  - assert:
      that:
        - _result_patch is not failed
        - _result_patch.response.message is match("Resource updated successfully")

  - name: "Delete charset by ID"
    thalesgroup.ciphertrust.cm_resource_delete:
      key: "{{ char_set_id }}"
      resource_type: "character-sets"
      localNode: "{{ this_node_connection_string }}"
    register: _result_delete_charset

  - assert:
      that:
        - _result_delete_charset is not failed

# Negative test - required params validation
- name: Negative test - missing required parameters should fail
  thalesgroup.ciphertrust.dpg_character_set_save: {}
  register: _negative_required_params_result
  ignore_errors: true

- name: Assert negative test failed as expected
  ansible.builtin.assert:
    that:
      - _negative_required_params_result is failed
    fail_msg: "Expected module to fail when required parameters are missing"
    success_msg: "Negative path validated for missing required parameters"

# Negative test - API error handling
- name: Negative test - API error should fail for unreachable CM
  thalesgroup.ciphertrust.cm_services:
    connection_string: "127.0.0.1:1"
    username: "admin"
    password: "invalid-password"
    verify_ssl: false
    op_type: "get"
  register: _negative_api_error_result
  ignore_errors: true

- name: Assert API error negative test failed as expected
  ansible.builtin.assert:
    that:
      - _negative_api_error_result is failed
    fail_msg: "Expected API request to fail when CipherTrust Manager is unreachable"
    success_msg: "Negative API error path validated"
