---
# Integration test for cm_certificate_authority module
# Tests certificate authority operations

- name: Set connection parameters
  ansible.builtin.set_fact:
    connection_string: "{{ lookup('env', 'CIPHERTRUST_CONNECTION_STRING') | default('localhost:8200', true) }}"
    username: "{{ lookup('env', 'CIPHERTRUST_USERNAME') | default('admin', true) }}"
    password: "{{ lookup('env', 'CIPHERTRUST_PASSWORD') | default('Thales123', true) }}"
    api_key: "{{ lookup('env', 'CIPHERTRUST_API_KEY') | default('', true) }}"
    domain: "{{ lookup('env', 'CIPHERTRUST_DOMAIN') | default('', true) }}"
    verify_ssl: "{{ lookup('env', 'CIPHERTRUST_VERIFY_SSL') | default('false', true) }}"

- name: Get certificate authority information
  thalesgroup.ciphertrust.cm_certificate_authority:
    connection_string: "{{ connection_string }}"
    username: "{{ username }}"
    password: "{{ password }}"
    api_key: "{{ api_key }}"
    domain: "{{ domain }}"
    verify_ssl: "{{ verify_ssl }}"
    op_type: "get"
  register: ca_result

- name: Verify certificate authority information
  ansible.builtin.assert:
    that:
      - ca_result is succeeded
      - ca_result is not failed
      - ca_result.response is defined
    fail_msg: "Failed to get certificate authority information"
    success_msg: "Successfully retrieved certificate authority information"

- name: Display certificate authority information
  ansible.builtin.debug:
    var: ca_result.response

# Negative test - required params validation
- name: Negative test - missing required parameters should fail
  thalesgroup.ciphertrust.cm_certificate_authority: {}
  register: _negative_required_params_result
  ignore_errors: true

- name: Assert negative test failed as expected
  ansible.builtin.assert:
    that:
      - _negative_required_params_result is failed
    fail_msg: "Expected module to fail when required parameters are missing"
    success_msg: "Negative path validated for missing required parameters"
