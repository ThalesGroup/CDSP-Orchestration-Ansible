site_name: ThalesGroup CipherTrust Ansible Collection
site_description: Documentation for the ThalesGroup CipherTrust Ansible Collection
site_url: https://thalesgroup.github.io/CDSP-Orchestration-Ansible/

repo_name: ThalesGroup/CDSP-Orchestration-Ansible
repo_url: https://github.com/ThalesGroup/CDSP-Orchestration-Ansible

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/lightbulb-outline
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/lightbulb
        name: Switch to light mode
  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
    - Quick Start: getting-started/quick-start.md
  - Modules: modules/index.md
  - Roles:
    - Overview: roles/index.md
    - crdp: roles/crdp.md
    - cte4k8s: roles/cte4k8s.md
    - cte4u: roles/cte4u.md
    - dpg: roles/dpg.md
  - Examples: examples/index.md
  - Best Practices: best-practices.md
  - Performance: performance-best-practices.md
  - Troubleshooting: troubleshooting.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: ThalesGroup
      repo: CDSP-Orchestration-Ansible
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  version: 1.0.3
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/thalesgroup
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/ansible/
