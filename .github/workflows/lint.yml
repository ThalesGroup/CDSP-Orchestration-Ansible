name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ansible_collections/thalesgroup/ciphertrust

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: ansible_collections/thalesgroup/ciphertrust

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.18.* ansible-lint

      - name: Run ansible-lint
        run: ansible-lint
