---
name: Build Validation

on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-collection:
    name: build-collection
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ansible_collections/thalesgroup/ciphertrust

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: ansible_collections/thalesgroup/ciphertrust

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.18.*

      - name: Build collection
        run: |
          mkdir -p dist
          ansible-galaxy collection build --output-path dist

      - name: Validate artifact name and structure
        run: |
          set -euo pipefail
          VERSION=$(python - <<'PY'
          import yaml
          with open("galaxy.yml", "r", encoding="utf-8") as fh:
              data = yaml.safe_load(fh)
          print(data["version"])
          PY
          )
          TAR="dist/thalesgroup-ciphertrust-${VERSION}.tar.gz"
          test -f "${TAR}"
          tar -tzf "${TAR}" > /tmp/collection-files.txt
          grep -q '^MANIFEST.json$' /tmp/collection-files.txt
          grep -q '^FILES.json$' /tmp/collection-files.txt
          grep -q '^plugins/modules/' /tmp/collection-files.txt
          grep -q '^plugins/module_utils/' /tmp/collection-files.txt
          ! grep -q '^\\.venv/' /tmp/collection-files.txt
          ! grep -q '^\\.ansible/' /tmp/collection-files.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: collection-build
          path: ansible_collections/thalesgroup/ciphertrust/dist/*.tar.gz
          retention-days: 7
