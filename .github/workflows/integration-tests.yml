---
name: Integration Tests

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      target:
        description: "Integration target to run (or 'all')"
        required: false
        default: "all"
        type: string

permissions:
  contents: read

env:
  CIPHERTRUST_CONNECTION_STRING: "${{ vars.CIPHERTRUST_CONNECTION_STRING }}"
  CIPHERTRUST_USERNAME: "${{ vars.CIPHERTRUST_USERNAME }}"
  CIPHERTRUST_PASSWORD: "${{ secrets.CIPHERTRUST_PASSWORD }}"
  CIPHERTRUST_API_KEY: "${{ vars.CIPHERTRUST_API_KEY }}"
  CIPHERTRUST_DOMAIN: "${{ vars.CIPHERTRUST_DOMAIN }}"
  CIPHERTRUST_VERIFY_SSL: "${{ vars.CIPHERTRUST_VERIFY_SSL }}"

jobs:
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    continue-on-error: true

    defaults:
      run:
        working-directory: ansible_collections/thalesgroup/ciphertrust

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: ansible_collections/thalesgroup/ciphertrust

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.18.*

      - name: Check integration environment
        id: precheck
        run: |
          set -euo pipefail
          missing=0
          for key in CIPHERTRUST_CONNECTION_STRING CIPHERTRUST_USERNAME CIPHERTRUST_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required integration setting: $key"
              missing=1
            fi
          done
          if [ "${missing}" -eq 1 ]; then
            echo "run-tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install integration dependencies
        if: steps.precheck.outputs.run-tests == 'true'
        run: |
          ansible-galaxy collection install -r tests/requirements.yml

      - name: Run integration tests
        if: steps.precheck.outputs.run-tests == 'true'
        continue-on-error: true
        run: |
          target="${{ github.event.inputs.target || 'all' }}"
          if [ "$target" = "all" ]; then
            ansible-test integration --color yes --timeout 300 --retry 2
          else
            ansible-test integration "$target" --color yes --timeout 300 --retry 2
          fi

      - name: Skip notice when integration settings are missing
        if: steps.precheck.outputs.run-tests != 'true'
        run: |
          echo "Integration tests skipped: required CM settings are not configured."

      - name: Upload test results
        if: always() && steps.precheck.outputs.run-tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ansible_collections/thalesgroup/ciphertrust/tests/output/
          retention-days: 7
