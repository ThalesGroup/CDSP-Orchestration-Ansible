---
name: Sanity

on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  sanity:
    name: sanity (py${{ matrix.python-version }}, ansible-${{ matrix.ansible-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            ansible-version: "2.15"
          - python-version: "3.10"
            ansible-version: "2.16"
          - python-version: "3.11"
            ansible-version: "2.17"
          - python-version: "3.12"
            ansible-version: "2.18"

    defaults:
      run:
        working-directory: ansible_collections/thalesgroup/ciphertrust

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: ansible_collections/thalesgroup/ciphertrust

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==${{ matrix.ansible-version }}.*"

      - name: Run ansible-test sanity
        run: |
          ansible-test sanity --color yes -v --requirements
