name: CodeQL

on:
  push:
  pull_request:
  schedule:
    # Re-scan weekly so newly published queries are applied to existing code.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (python)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # security-extended adds lower-severity security queries on top of
          # the default set; worth the extra runtime for a security product.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
