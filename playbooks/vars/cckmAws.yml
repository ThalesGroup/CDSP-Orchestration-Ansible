---
this_node_address: <CM_IP_OR_FQDN>
this_node_username: <CM_ADMIN_USERNAME>
this_node_password: <CM_ADMIN_PASSWORD>

this_node_connection_string:
  server_ip: "{{ this_node_address }}"
  user: "{{ this_node_username }}"
  password: "{{ this_node_password }}"
  auth_domain_path:
  verify: false

# AWS credentials CipherTrust Manager uses to reach the account. Supply the
# secret through Ansible Vault or an external secret store rather than here.
aws_access_key_id: <AWS_ACCESS_KEY_ID>
aws_secret_access_key: <AWS_SECRET_ACCESS_KEY>

aws_connection_name: AnsibleAwsConnection
aws_kms_name: AnsibleAwsAccount
aws_region: us-east-1
aws_key_alias: AnsibleDemoKey
aws_policy_template_name: AnsibleDemoKeyPolicy

# IAM principals the key policy grants access to. These must already exist in
# the AWS account; list them with cckm_aws_account_info.
aws_key_admins: []
aws_key_users: []
