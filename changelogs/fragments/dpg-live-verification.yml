bugfixes:
  - >-
    ``dpg_client_profile_save`` documents that the NAE interface named by
    ``nae_iface_port`` must be in ``tls-cert-pw-opt`` mode. CipherTrust
    Manager supports no other mode for DPG, and rejects every one of them with
    "DPG is not supported with interface with mode <mode>". The requirement
    was undocumented, so the only way to find it was to hit it.

minor_changes:
  - >-
    ``module_dpg_client_profile_save`` builds its own NAE interface in the one
    mode DPG accepts rather than binding to whatever happens to be listening
    on the configured port, and clears any interface an earlier failed run
    left behind before creating it -- the port is what makes an interface
    unique, so a leftover made every later run fail with 409.
  - >-
    ``integration_config.yml.template`` documents that ``local_ca_id`` is
    specific to one CipherTrust Manager and must be read from
    ``GET /v1/ca/local-cas``, and that ``nae_interface_port_number`` must name
    a free port.
  - >-
    ``module_vault_keys2_op`` asked for a 2048-bit AES key, which CipherTrust
    Manager rejects -- 2048 is an RSA size, and AES accepts 128, 192 or 256.
    The target had only ever passed because it reused a fixed key name and so
    matched a key left behind by an earlier run, which turned the create into
    a no-op. It now uses a per-run name and a valid size, so the create is
    actually exercised.
  - >-
    Removed 66 dead ``teardown.yml`` files from the integration targets --
    a root copy and a ``tasks/`` copy for each. ``ansible-test`` runs a
    target's ``tasks/main.yml`` and has no teardown hook, and nothing in the
    repository included them, so none had ever run. The ``tasks/`` copies were
    stale scaffolding that referenced variables the targets do not define, and
    the root copies were an identical placeholder announcing that cleanup
    happens inline. Cleanup does happen inline, in the targets themselves.
    This also clears all 33 of the ``ignore-errors`` findings ansible-lint
    reported at its ``production`` profile.
