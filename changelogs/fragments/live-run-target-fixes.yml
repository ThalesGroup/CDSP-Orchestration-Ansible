bugfixes:
  - >-
    ``interface_save`` could not patch an interface. ``port`` was required for
    every operation, so a patch always re-sent it and CipherTrust Manager
    answered 409 because that port is already bound. ``port`` is now required
    only for ``op_type: create``. The module also documents that CM addresses
    an interface by the name it derives (for example ``nae_all_9005``), not by
    the identifier returned as ``id``, which yields 404.
  - >-
    Fifteen integration tasks supplied no ``localNode`` at all and could never
    have run; a further set asserted response fields CipherTrust Manager does
    not return. Groups are keyed by ``name`` and users by ``user_id``; neither
    returns an ``id``.
  - >-
    ``cte_signature_set`` passed ``signature_id`` as a literal string rather
    than an expression, and read the filtered lookup as if it returned a bare
    id instead of a resource list.
  - >-
    ``vault_keys2_op`` attempted to destroy a key while it was Active, which
    CipherTrust Manager rejects; the key is now deactivated first.
  - >-
    ``cte_csi_storage_group`` used Kubernetes names CipherTrust Manager
    rejects. ``k8s_namespace`` and ``k8s_storage_class`` must follow RFC 1123
    (lowercase alphanumeric and hyphens).

minor_changes:
  - >-
    Integration targets that create named resources now derive the name from a
    per-run suffix computed once, so a failed run cannot leave state that makes
    the next one fail. Previously the suffix used ``| random`` inside a
    variable, which Ansible re-evaluates on every reference, so a create and
    the patch that followed it addressed different resources.
  - >-
    ``group_add_remove_object`` documents that CipherTrust Manager 2.22 answers
    a GET on the membership path with 405, so the module cannot establish
    membership there and performs the operation. An inconclusive answer never
    causes the operation to be skipped.

security_fixes:
  - >-
    ``tests/integration/integration_config.yml`` held live CipherTrust Manager
    credentials, was tracked in git, and was shipped inside the built
    collection artifact. It is now a committed
    ``integration_config.yml.template``; the working copy is git-ignored and
    excluded from the build, along with local coverage state. CONTRIBUTING
    documents how to run each suite.
