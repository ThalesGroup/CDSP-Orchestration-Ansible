bugfixes:
  - >-
    Fixed a malformed assertion in the ``cte_policy_save`` integration target
    where ``that`` was a sibling of ``assert`` rather than its argument.
    Ansible rejected the task outright, so everything after it in that target
    never ran.
  - >-
    The ``usermgmt_users_save`` integration target passed an undefined
    ``{{ name }}`` where it meant ``{{ firstname_lastname }}``.
  - >-
    Eight integration targets referenced ``this_node_connection_string``
    without defining it.

minor_changes:
  - >-
    Every integration task and block is now named, so a failure identifies the
    step that failed rather than printing the module arguments.
  - >-
    ``tests/`` is no longer excluded from ``ansible-lint``. The repository is
    clean at the configured ``basic`` profile. At the stricter ``production``
    profile 60 findings remain, all of them ``ignore_errors`` on teardown and
    sample-playbook tasks that are meant to tolerate a failure, plus missing
    ``galaxy_tags`` on the placeholder roles.
  - >-
    Integration variables no longer shadow Ansible or Jinja names: the CSI
    target's ``namespace`` (a Jinja built-in) is now ``csi_namespace``, and
    the interface target's ``port`` (an Ansible reserved name) is now
    ``interface_port``. ``keyName``/``keyAlgo``/``keySize`` are snake_case.
  - >-
    ``tests/unit/test_integration_targets.py`` also checks that every variable
    a target references is defined by its vars, defaults, ``set_fact`` or
    ``register``, which is what caught the missing connection variable above.
