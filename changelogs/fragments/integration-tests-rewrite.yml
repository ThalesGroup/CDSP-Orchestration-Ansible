bugfixes:
  - >-
    The integration test suite exercised an API the collection does not have.
    Every target passed ``connection_string``, ``username``, ``password``,
    ``api_key``, ``domain`` and ``verify_ssl`` in place of ``localNode``, and
    several used ``op_type`` values the modules reject (``get`` for
    ``cm_services`` and ``cm_certificate_authority``, ``delete`` for
    ``group_save`` and ``usermgmt_users_save``). The failures were hidden by
    ``ignore_errors``, so the suite reported success while testing nothing.
  - >-
    Cleanup tasks in the integration suite could never have worked: they
    called ``group_save`` and ``usermgmt_users_save`` with a ``delete``
    operation that does not exist, so test users and groups accumulated on any
    system the suite was run against. Users are now removed through
    ``cm_resource_delete``; groups are reported as needing manual removal,
    since the collection has no group delete operation.

minor_changes:
  - >-
    Added an ``idempotency`` integration target that asserts the contract
    against a live CipherTrust Manager: a second create reports no change, a
    patch that sends the current state reports no change, check mode agrees
    with a real run, and a resource name containing a space or ``&`` is still
    matched by the GET-before-write lookup.
  - >-
    Added an ``error_handling`` integration target covering an unreachable
    manager, invalid credentials, rejected parameter combinations and absent
    resources, asserting each surfaces as a message rather than a traceback
    and that credentials never appear in a failure message.
  - >-
    Integration targets now clean up in ``always:`` blocks and name resources
    with a per-run suffix, so a failure part way through neither leaves
    objects behind nor breaks the next run.
  - >-
    ``tests/unit/test_integration_targets.py`` validates every integration
    target against the modules' real argument specs, so the integration suite
    cannot drift away from the collection again without the unit suite failing.
