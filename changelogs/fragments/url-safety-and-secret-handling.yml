security_fixes:
  - >-
    Resource names and identifiers are now percent-encoded before they are
    placed in a request URL. They were concatenated verbatim, so a value
    containing ``/`` could address a different API collection than the one
    intended (for example ``cm_resource_delete`` with a ``key`` of
    ``../../usermgmt/users/admin`` produced
    ``DELETE vault/keys2/../../usermgmt/users/admin``), and a value containing
    ``&`` injected additional parameters into the GET-before-write idempotency
    lookup, changing which resource a module considered a match.
  - >-
    Query strings are now built with proper encoding rather than string
    concatenation, so a resource name containing ``&`` or ``=`` cannot alter
    the parameters of a lookup.
  - >-
    The ``material`` option of ``vault_keys2_save`` is now marked ``no_log``.
    Raw key material supplied to the module appeared in Ansible logs and
    verbose output.

bugfixes:
  - >-
    Resource names containing a space no longer produce a malformed request.

minor_changes:
  - >-
    ``vault_keys2_op``, ``vault_keys2_save``, ``cm_certificate_authority``,
    ``cm_regtoken``, ``interface_actions`` and ``interface_save`` now document
    that their response can contain secret material and that ``no_log: true``
    should be set on those tasks. Ansible cannot redact part of a return value.
  - >-
    ``SECURITY.md`` has been rewritten. It previously contained unedited
    GitHub template text and a supported-versions table listing versions that
    do not exist for this collection. It now covers reporting, disclosure, and
    the settings that affect the security of a deployment.

removed_features:
  - >-
    Removed ``docs/module-reference/`` and ``docs/module-reference.md``. These
    were hand-maintained copies of the module documentation; all 33 had drifted
    from the modules (263 options undocumented, 248 documented options that no
    longer existed) and the top-level page described options that never existed.
    Per-module reference is generated from the modules and published at the
    collection documentation site.
