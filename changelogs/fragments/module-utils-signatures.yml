bugfixes:
  - >-
    ``dpg_policy_save`` raised ``TypeError`` instead of validating whenever any
    of ``json_request_get_tokens``, ``json_request_post_tokens``,
    ``json_request_put_tokens``, ``json_response_get_tokens``,
    ``json_response_put_tokens``, ``url_request_get_tokens`` or
    ``url_request_patch_tokens`` was supplied. The token check called a
    validation helper with arguments that helper does not accept, so the
    module's central use case aborted with a traceback before reaching the API.
  - >-
    ``interface_save`` raised ``TypeError`` when ``trusted_cas`` was supplied,
    ``usermgmt_users_save`` when ``allowed_auth_methods`` or ``login_flags``
    was supplied, and ``vault_keys2_save`` when any of its dict or list
    parameters was supplied, all for the same reason. The checks duplicated
    validation the argument spec already performs and have been removed.

minor_changes:
  - >-
    Every function in ``module_utils`` now declares the arguments it requires
    instead of taking ``**kwargs`` and reading ``kwargs["node"]`` at runtime.
    A caller that omits or misspells a required argument is now rejected by
    Python rather than failing deep inside the call or building a URL from
    ``None`` -- the cause of two previously shipped defects.
  - >-
    Added ``tests/unit/test_module_utils_signatures.py``, which checks that no
    ``module_utils`` function takes only ``**kwargs``, that every function
    building a client declares ``node``, and that all 126 call sites in
    ``plugins/modules`` supply the arguments their target requires.

removed_features:
  - >-
    Removed ``validate_list_elements`` from ``module_utils/validation.py``. Its
    only call sites passed arguments it does not accept and duplicated the
    argument spec; none remained after those were removed.
