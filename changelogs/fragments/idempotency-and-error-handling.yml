bugfixes:
  - >-
    All modules now fail cleanly via ``fail_json`` when CipherTrust Manager
    returns an HTTP error status or is unreachable. Previously ``HTTPError``
    and ``URLError`` escaped the collection's error handling and the module
    aborted with a Python traceback
    (https://github.com/ThalesGroup/CDSP-Orchestration-Ansible).
  - >-
    ``op_type: patch`` operations are now idempotent. The resource identifier
    passed to the patch helper (``cm_key_id``, ``policy_id``, ``old_name`` and
    equivalents) is no longer compared against the resource's current state,
    which previously made every patch report ``changed=true`` and issue a
    redundant write on each run.
  - >-
    A failed resource lookup other than "not found" (for example HTTP 403 or
    500) is now reported as an error instead of being treated as "resource
    absent", which could lead to a duplicate create attempt.

  - >-
    Parameter validation errors in ``vault_keys2_save``, ``usermgmt_users_save``,
    ``interface_save`` and ``dpg_policy_save`` are now reported through
    ``fail_json``. ``validate_parameters`` ran outside the module's error
    handling, so an invalid parameter combination aborted with a Python
    traceback instead of the guidance the exception carries.
  - >-
    ``cm_resource_delete`` now deletes the resource named by ``key``. For every
    resource type except ``cluster`` it issued a DELETE against the collection
    endpoint (for example ``vault/keys2``) and ignored ``key`` entirely. It also
    now reports a missing ``key`` instead of building a request without one.
  - >-
    ``licensing_lockdata_get`` now fails when CipherTrust Manager returns an
    error. ``getLockdata`` swallowed the exception and returned
    ``{"failed": true}``, which Ansible reported as a successful run.
  - >-
    ``cte_signature_set`` with ``op_type: get_signature`` no longer raises
    ``TypeError`` when ``file_name`` is omitted, which ``required_if`` permits.
  - >-
    ``cm_resource_get_id_from_name`` reports a clear error when the matched
    resource has no id field, instead of raising ``KeyError``.

  - >-
    ``ThalesCipherTrustModule`` now honours a ``module_class`` override instead
    of always reading the class default, and no longer advertises an
    ``auto_retry`` setting that was never implemented.
  - >-
    The helpers in ``module_utils/validation.py`` each have a single signature
    and no longer accept arbitrary keywords. The previous ``**kwargs``
    catch-all silently discarded misspelled and unsupported arguments; one call
    site in ``vault_keys2_save`` passed ``parameter=`` where the function
    expected ``parameter_name=``, so its errors named ``parameter: None``.
  - >-
    An empty parameter dictionary is no longer treated as "no parameters
    supplied" during validation.

removed_features:
  - >-
    Removed the unused ``cache``, ``connection_management``, ``cckm_aws``,
    ``cckm_azure``, ``cckm_gcp`` and ``cckm_commons`` module_utils. None of
    them were imported by any module in the collection; the CCKM helpers will
    return alongside the CCKM modules that use them.
  - >-
    Removed ``playbooks/cckm_az.yml``, ``playbooks/cckm_gcp.yml`` and
    ``playbooks/vars/cckm.yml``, along with the CCKM and connection-management
    entries in the documentation. They referenced modules that have never
    existed in this collection and failed immediately when run.

deprecated_features:
  - >-
    The ``localNode`` sub-options ``server_port`` and ``server_private_ip`` are
    deprecated and will be removed in 2.0.0. Neither has ever been used: the
    collection connects to ``server_ip`` over HTTPS on the default port. They
    are still accepted so existing playbooks keep working, but they have been
    removed from the collection's own examples, sample playbooks and roles.
  - >-
    The ``localNode`` sub-option ``verify`` will default to ``true`` in 2.0.0.
    Set it explicitly to keep the current behaviour across that upgrade.

minor_changes:
  - >-
    ``tests/sanity`` and ``tests/integration`` now ship in the built collection.
    ``build_ignore`` excluded all of ``tests``, so ``ansible-test sanity`` run
    against the artifact -- the way certification runs it -- could not find the
    ``ignore-*.txt`` waivers. Only ``tests/unit`` and its fixtures are excluded.
  - >-
    ``mkdocs.yml`` no longer uses the deprecated ``materialx`` emoji tags, which
    were unparsable by libyaml and required a sanity waiver that could not be
    satisfied inside the build artifact.
  - >-
    CI now runs on every branch rather than only ``main``, ``ansible-test
    sanity`` runs its full default test set instead of a hand-picked subset,
    ``ansible-lint`` covers ``plugins/``, ``roles/`` and ``playbooks/``, and
    integration-test failures fail the build. The collection is clean under
    all 24 sanity tests and under ansible-lint's ``basic`` profile.
  - >-
    Module documentation now uses the same snake_case option names the modules
    actually accept, with the historical camelCase spellings recorded as
    aliases. Previously ``ansible-doc`` advertised camelCase names while the
    argument_spec had been normalized to snake_case at runtime.
  - >-
    Fixed ``playbooks/cluster.yml``, which referenced a non-existent
    ``cm_cluster_join`` module instead of ``cm_cluster`` with ``op_type: join``.
  - >-
    The ``dpg``, ``cte4u`` and ``cte4k8s`` roles are now clearly documented as
    unimplemented placeholders, and their ``meta/main.yml`` files carry real
    author, license and ``min_ansible_version`` metadata instead of the
    ``ansible-galaxy init`` boilerplate.
