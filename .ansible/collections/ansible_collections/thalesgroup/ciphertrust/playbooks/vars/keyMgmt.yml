---
this_node_address: <CM_IP_OR_FQDN>
this_node_username: <CM_ADMIN_USERNAME>
this_node_password: <CM_ADMIN_PASSWORD>

this_node_connection_string:
  server_ip: "{{ this_node_address }}"
  user: "{{ this_node_username }}"
  password: "{{ this_node_password }}"
  auth_domain_path: "{{ this_node_tenant_id }}"
  verify: false

key_name: <KEY_NAME>
key_revocation_reason: KeyCompromise
key_revocation_message: "By Ansible"
key_reactivation_reason: DeactivatedToActive
key_reactivation_message: "By Ansible"
