#
# Creates a NAE interface, proves the create is idempotent, patches it, and
# removes it again. The port comes from integration_config so a test system
# can choose one that is free; the interface is deleted in an always: block so
# a failure part way through does not leave the port bound.

- name: Verify integration_config was supplied
  ansible.builtin.assert:
    that:
      - cm_connection_string is defined
    fail_msg: "cm_connection_string must be set in integration_config.yml"

- name: Name this run's resources
  ansible.builtin.set_fact:
    run_suffix: "{{ 99999999 | random }}"
    test_interface_port: "{{ nae_interface_port_number | default(9005) }}"

- name: Interface lifecycle
  block:
    - name: Create a NAE interface
      thalesgroup.ciphertrust.interface_save:
        localNode: "{{ this_node_connection_string }}"
        op_type: create
        interface_type: nae
        port: "{{ test_interface_port | int }}"
        mode: "no-tls-pw-opt"
      register: _iface_create

    - name: The interface was created
      ansible.builtin.assert:
        that:
          - _iface_create is not failed
          - _iface_create is changed
          - _iface_create.response.id is defined
        fail_msg: "Failed to create the NAE interface"
        success_msg: "NAE interface created"

    - name: Save the interface id
      ansible.builtin.set_fact:
        test_interface_id: "{{ _iface_create.response.name }}"

    # CipherTrust Manager derives the interface name from its type, network
    # interface and port (nae_all_9005) and rejects a supplied name, so the
    # module's GET-before-write lookup -- which searches by the name the
    # playbook passes -- cannot match an interface it just created. Creating
    # the same interface twice therefore raises a port conflict rather than
    # reporting no change, and that is asserted in the module's documentation
    # rather than exercised here.

    - name: Patch the interface
      thalesgroup.ciphertrust.interface_save:
        localNode: "{{ this_node_connection_string }}"
        op_type: patch
        interface_id: "{{ test_interface_id }}"
        mode: "no-tls-pw-req"
      register: _iface_patch

    - name: The patch reported a change
      ansible.builtin.assert:
        that:
          - _iface_patch is not failed
          - _iface_patch is changed
        fail_msg: "Expected the interface patch to be applied"
        success_msg: "Interface patched"

    - name: Patch the interface with the value it now has
      thalesgroup.ciphertrust.interface_save:
        localNode: "{{ this_node_connection_string }}"
        op_type: patch
        interface_id: "{{ test_interface_id }}"
        mode: "no-tls-pw-req"
      register: _iface_patch_noop

    - name: Re-applying the same value makes no change
      ansible.builtin.assert:
        that:
          - _iface_patch_noop is not changed
        fail_msg: >-
          patch reported changed while sending the current state; the resource
          identifier is probably being compared as though it were a field.

  always:
    - name: Remove the interface
      thalesgroup.ciphertrust.cm_resource_delete:
        localNode: "{{ this_node_connection_string }}"
        resource_type: interfaces
        key: "{{ test_interface_id }}"
      when: test_interface_id is defined
      failed_when: false

# Negative test - required params validation
- name: Negative test - missing required parameters should fail
  thalesgroup.ciphertrust.interface_save: {}
  register: _negative_required_params_result
  ignore_errors: true

- name: Assert negative test failed as expected
  ansible.builtin.assert:
    that:
      - _negative_required_params_result is failed
      - >-
        "missing required arguments" in
        (_negative_required_params_result.msg | default(""))
    fail_msg: >-
      Expected the module to reject a task with no parameters and name the
      missing arguments, got: {{ _negative_required_params_result.msg | default("no message") }}
    success_msg: "Module rejects a task with no parameters"
