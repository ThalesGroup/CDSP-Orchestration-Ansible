# # Verify that integration_config was specified
- name: Name this run's resources
  ansible.builtin.set_fact:
    run_suffix: "{{ 99999999 | random }}"

- name: Verify integration_config was supplied
  block:
    - name: Verify integration_config was supplied
      ansible.builtin.assert:
        that:
          - this_node_connection_string is defined
          - group_name is defined
          - new_group_name is defined

# # Validate the create group module
- name: Create Group
  block:
    - name: "Create Group"
      thalesgroup.ciphertrust.group_save:
        op_type: create
        name: "{{ group_name }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_create

    - name: Verify create Group
      ansible.builtin.assert:
        that:
          - _result_create is not failed
          - _result_create.response.name is string

    - name: "Patch Group"
      thalesgroup.ciphertrust.group_save:
        op_type: patch
        old_name: "{{ group_name }}"
        name: "{{ new_group_name }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_patch

    - name: Verify patch Group
      ansible.builtin.assert:
        that:
          - _result_patch is not failed
          - _result_patch.response.name is defined
    # Create User for testing add/remove user to group testing
    - name: "Create User"
      thalesgroup.ciphertrust.usermgmt_users_save:
        localNode: "{{ this_node_connection_string }}"
        op_type: "create"
        username: "{{ username }}"
        password: "{{ password }}"
        email: "{{ email }}"
        name: "{{ firstname_lastname }}"
      register: _result_user_create

    - name: Verify create User
      ansible.builtin.assert:
        that:
          - _result_user_create is not failed
          - _result_user_create.response.user_id is string

    - name: "Save user ID"
      ansible.builtin.set_fact:
        user_id: "{{ _result_user_create.response.user_id }}"

    - name: "Add User to Group"
      thalesgroup.ciphertrust.group_add_remove_object:
        op_type: add
        object_type: user
        object_id: "{{ user_id }}"
        name: "{{ new_group_name }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_add_user

    - name: Verify add User to Group
      ansible.builtin.assert:
        that:
          - _result_add_user is not failed

