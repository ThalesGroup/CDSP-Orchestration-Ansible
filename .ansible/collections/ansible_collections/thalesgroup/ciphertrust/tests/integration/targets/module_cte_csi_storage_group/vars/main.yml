---
this_node_connection_string: "{{ cm_connection_string }}"

storage_group_name: "AnsibleIntegrationTest_CSI_{{ run_suffix }}"
csi_namespace: "ansible-test-ns-{{ run_suffix }}"
storage_class: "ansible-test-sc-{{ run_suffix }}"
client_profile: DefaultClientProfile
description: "Created via Ansible"

username: admin
key_name: "AnsibleCTEKey_{{ run_suffix }}"
key_algo: aes
key_size: 256
resource_set_name: Ansible_RES_SET
cte_policy_name: Ansible-CTE-Policy
