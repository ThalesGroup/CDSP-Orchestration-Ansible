# # Verify that integration_config was specified
- name: Check whether this target can run here
  ansible.builtin.set_fact:
    _can_run: "{{ cert_bundle_pem is defined and not (cert_bundle_pem | string).startswith('<') }}"

- name: Explain why this target is being skipped
  ansible.builtin.debug:
    msg: >-
      Skipping module_interface_actions: it needs a certificate and key pair, a CSR CN and an interface to act on.
      Set it in tests/integration/integration_config.yml to run this target.
  when: not _can_run

- name: End the play when the target cannot run
  ansible.builtin.meta: end_play
  when: not _can_run

- name: Verify integration_config was supplied
  block:
    - name: Verify integration_config was supplied
      ansible.builtin.assert:
        that:
          - this_node_connection_string is defined
          - csr_cn is defined
          - cert_bundle_pem is defined
          - cert_format is defined
          - source_interface is defined
          - port is defined
          - type is defined
          - mode is defined
          - new_port is defined

# # Validate the create interface module
- name: Create Interface
  block:
    - name: "Create Interface"
      thalesgroup.ciphertrust.interface_save:
        localNode: "{{ this_node_connection_string }}"
        op_type: create
        port: "{{ interface_port }}"
        auto_registration: false
        interface_type: "{{ type }}"
        mode: "{{ mode }}"
        network_interface: all
      register: _result_create

    - name: Verify create Interface
      ansible.builtin.assert:
        that:
          - _result_create is not failed
          - _result_create.response.id is string

    - name: "Save interface ID"
      ansible.builtin.set_fact:
        interface_id: "{{ _result_create.response.id }}"

    - name: "Patch Interface"
      thalesgroup.ciphertrust.interface_save:
        op_type: "patch"
        interface_id: "{{ interface_id }}"
        port: "{{ new_port }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_patch

    - name: Verify patch Interface
      ansible.builtin.assert:
        that:
          - _result_patch is not failed
          - _result_patch.response.id is defined
    # # Validate the interface actions
    - name: "Add Cert to Interface"
      thalesgroup.ciphertrust.interface_actions:
        localNode: "{{ this_node_connection_string }}"
        op_type: put_certificate
        interface_id: "{{ interface_id }}"
        certificate: "{{ cert_bundle_pem }}"
        generate: true
        format: "{{ cert_format }}"
      register: _result_add_cert

    - name: Verify add Cert to Interface
      ansible.builtin.assert:
        that:
          - _result_add_cert is not failed
          - _result_add_cert.response.id is defined
    - name: "Enable Interface"
      thalesgroup.ciphertrust.interface_actions:
        op_type: enable
        interface_id: "{{ interface_id }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_enable

    - name: Verify enable Interface
      ansible.builtin.assert:
        that:
          - _result_enable is not failed
          - _result_enable.response.id is defined
    - name: "Disable Interface"
      thalesgroup.ciphertrust.interface_actions:
        op_type: disable
        interface_id: "{{ interface_id }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_disable

    - name: Verify disable Interface
      ansible.builtin.assert:
        that:
          - _result_disable is not failed
          - _result_disable.response.id is defined
    - name: "Restore default TLS Ciphers"
      thalesgroup.ciphertrust.interface_actions:
        op_type: restore-default-tls-ciphers
        interface_id: "{{ interface_id }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_restore

    - name: Verify restore default TLS Ciphers
      ansible.builtin.assert:
        that:
          - _result_restore is not failed

    - name: "Create CSR"
      thalesgroup.ciphertrust.interface_actions:
        op_type: csr
        interface_id: "{{ interface_id }}"
        cn: "{{ csr_cn }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_create_csr

    - name: Verify create CSR
      ansible.builtin.assert:
        that:
          - _result_create_csr is not failed
          - _result_create_csr.response.csr is match("Resource created successfully")

#  - name: "Auto Generate Server Certificate"
#    thalesgroup.ciphertrust.interface_actions:
#      op_type: auto-gen-server-cert
#      interface_id: "{{ interface_id }}"
#      localNode: "{{ this_node_connection_string }}"
#    register: _result_autogen

#  - assert:
#      that:
#        - _result_autogen is not failed
#        - _result_autogen.response.message is match("Resource created successfully")

    - name: "Use Certificate"
      thalesgroup.ciphertrust.interface_actions:
        op_type: use-certificate
        copy_from: "{{ source_interface }}"
        interface_id: "{{ interface_id }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_use_cert

    - name: Verify use Certificate
      ansible.builtin.assert:
        that:
          - _result_use_cert is not failed
          - _result_use_cert.response.id is defined
# Negative test - required params validation
- name: Negative test - missing required parameters should fail
  thalesgroup.ciphertrust.interface_actions: {}
  register: _negative_required_params_result
  ignore_errors: true

- name: Assert negative test failed as expected
  ansible.builtin.assert:
    that:
      - _negative_required_params_result is failed
      - >-
        "missing required arguments" in
        (_negative_required_params_result.msg | default(""))
    fail_msg: >-
      Expected the module to reject a task with no parameters and name the
      missing arguments, got: {{ _negative_required_params_result.msg | default("no message") }}
    success_msg: "Module rejects a task with no parameters"
