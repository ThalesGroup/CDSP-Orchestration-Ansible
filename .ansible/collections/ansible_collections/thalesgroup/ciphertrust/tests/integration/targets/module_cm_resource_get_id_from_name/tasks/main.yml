# Resolves a resource name to its id. A key is created so there is something
# real to resolve, and removed again afterwards.

- name: Verify integration_config was supplied
  ansible.builtin.assert:
    that:
      - cm_connection_string is defined
    fail_msg: "cm_connection_string must be set in integration_config.yml"

- name: Name this run's resources
  ansible.builtin.set_fact:
    run_suffix: "{{ 99999999 | random }}"

- name: Resolve a name to an id
  block:
    - name: Create a key to look up
      thalesgroup.ciphertrust.vault_keys2_save:
        localNode: "{{ this_node_connection_string }}"
        op_type: create
        name: "AnsibleIntegrationTest_Lookup_{{ run_suffix }}"
        algorithm: aes
        size: 256
        usageMask: 3145740
      register: _key

    - name: Resolve the key's name to its id
      thalesgroup.ciphertrust.cm_resource_get_id_from_name:
        localNode: "{{ this_node_connection_string }}"
        resource_type: keys
        query_param: name
        query_param_value: "AnsibleIntegrationTest_Lookup_{{ run_suffix }}"
      register: _lookup

    - name: The lookup returns the id of the key that was created
      ansible.builtin.assert:
        that:
          - _lookup is not failed
          - _lookup is not changed
          - _lookup.response.id == _key.response.id
        fail_msg: >-
          Expected the lookup to return {{ _key.response.id }},
          got {{ _lookup.response | default("nothing") }}
        success_msg: "Name resolved to the correct resource id"

    - name: Resolve a name that does not exist
      thalesgroup.ciphertrust.cm_resource_get_id_from_name:
        localNode: "{{ this_node_connection_string }}"
        resource_type: keys
        query_param: name
        query_param_value: "AnsibleIntegrationTest_NoSuchKey_{{ run_suffix }}"
      register: _absent
      ignore_errors: true

    - name: An unmatched name fails cleanly
      ansible.builtin.assert:
        that:
          - _absent is failed
          - "'Traceback' not in (_absent.msg | default(''))"
        fail_msg: "Expected a clean failure for an unmatched name"
        success_msg: "Unmatched name reported cleanly"

  always:
    - name: Remove the key
      thalesgroup.ciphertrust.cm_resource_delete:
        localNode: "{{ this_node_connection_string }}"
        resource_type: keys
        key: "{{ _key.response.id }}"
      when: _key.response.id is defined
      failed_when: false

# Negative test - required params validation
- name: Negative test - missing required parameters should fail
  thalesgroup.ciphertrust.cm_resource_get_id_from_name: {}
  register: _negative_required_params_result
  ignore_errors: true

- name: Assert negative test failed as expected
  ansible.builtin.assert:
    that:
      - _negative_required_params_result is failed
      - >-
        "missing required arguments" in
        (_negative_required_params_result.msg | default(""))
    fail_msg: >-
      Expected the module to reject a task with no parameters and name the
      missing arguments, got: {{ _negative_required_params_result.msg | default("no message") }}
    success_msg: "Module rejects a task with no parameters"
