# # Verify that integration_config was specified
- name: Verify integration_config was supplied
  block:
    - name: Verify integration_config was supplied
      ansible.builtin.assert:
        that:
          - this_node_connection_string is defined
          - key_name is defined
          - key_algo is defined
          - key_len is defined
          - usage_mask is defined

# # Validate the vault_keys2_save module - Create Operation
- name: Create Key
  block:
    - name: "Create Key"
      thalesgroup.ciphertrust.vault_keys2_save:
        op_type: create
        name: "{{ key_name }}"
        algorithm: "{{ key_algo }}"
        size: "{{ key_len }}"
        usageMask: "{{ usage_mask }}"
        localNode: "{{ this_node_connection_string }}"
      register: _result_create

    - name: Verify create Key
      ansible.builtin.assert:
        that:
          - _result_create is not failed
          - _result_create.response.id is string
          - _result_create.response.name == key_name

    - name: "Save key ID"
      ansible.builtin.set_fact:
        key_id: "{{ _result_create.response.id }}"

# # Validate the vault_keys2_save module - Patch Operation
- name: Patch Key
  block:
    - name: "Patch Key"
      thalesgroup.ciphertrust.vault_keys2_save:
        op_type: "patch"
        cm_key_id: "{{ key_id }}"
        unexportable: false
        localNode: "{{ this_node_connection_string }}"
      register: _result_patch

    - name: Verify patch Key
      ansible.builtin.assert:
        that:
          - _result_patch is not failed
          - _result_patch.response.id is defined
# # Validate the vault_keys2_save module - Create Version Operation
- name: Create Version
  block:
    - name: "Create Version"
      thalesgroup.ciphertrust.vault_keys2_save:
        op_type: create_version
        cm_key_id: "{{ key_id }}"
        encoding: "base64"
        localNode: "{{ this_node_connection_string }}"
      register: _result_create_version

    - name: Verify create Version
      ansible.builtin.assert:
        that:
          - _result_create_version is not failed
          - _result_create_version.response.id is defined
# # Cleanup - Delete the key
- name: Delete Key
  block:
    - name: "Delete Key"
      thalesgroup.ciphertrust.cm_resource_delete:
        localNode: "{{ this_node_connection_string }}"
        resource_type: keys
        key: "{{ key_id }}"
      register: _result_delete

    - name: Verify delete Key
      ansible.builtin.assert:
        that:
          - _result_delete is not failed

# Negative test - required params validation
- name: Negative test - missing required parameters should fail
  thalesgroup.ciphertrust.vault_keys2_save: {}
  register: _negative_required_params_result
  ignore_errors: true

- name: Assert negative test failed as expected
  ansible.builtin.assert:
    that:
      - _negative_required_params_result is failed
      - >-
        "missing required arguments" in
        (_negative_required_params_result.msg | default(""))
    fail_msg: >-
      Expected the module to reject a task with no parameters and name the
      missing arguments, got: {{ _negative_required_params_result.msg | default("no message") }}
    success_msg: "Module rejects a task with no parameters"
