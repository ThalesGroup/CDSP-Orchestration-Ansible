#
# Reads the trial licence. A CipherTrust Manager with no trials is a valid
# state, and the module reports that as a clean failure rather than raising,
# so both outcomes are accepted -- but a traceback is not.

- name: Verify integration_config was supplied
  ansible.builtin.assert:
    that:
      - cm_connection_string is defined
    fail_msg: "cm_connection_string must be set in integration_config.yml"

- name: Read the trial licence
  thalesgroup.ciphertrust.license_trial_get:
    localNode: "{{ this_node_connection_string }}"
  register: _trial
  ignore_errors: true

- name: Either a trial is described, or its absence is reported cleanly
  ansible.builtin.assert:
    that:
      - >-
        (_trial is not failed and _trial.response.id is defined
         and _trial.response.status is defined)
        or
        (_trial is failed and "No trial licenses" in (_trial.msg | default("")))
      - "'Traceback' not in (_trial.msg | default(''))"
    fail_msg: >-
      Expected either a trial licence or a clean "no trial licenses" failure,
      got: {{ _trial.msg | default(_trial.response | default("nothing")) }}
    success_msg: "Trial licence state reported cleanly"

# Negative test - required params validation
- name: Negative test - missing required parameters should fail
  thalesgroup.ciphertrust.license_trial_get: {}
  register: _negative_required_params_result
  ignore_errors: true

- name: Assert negative test failed as expected
  ansible.builtin.assert:
    that:
      - _negative_required_params_result is failed
      - >-
        "missing required arguments" in
        (_negative_required_params_result.msg | default(""))
    fail_msg: >-
      Expected the module to reject a task with no parameters and name the
      missing arguments, got: {{ _negative_required_params_result.msg | default("no message") }}
    success_msg: "Module rejects a task with no parameters"
