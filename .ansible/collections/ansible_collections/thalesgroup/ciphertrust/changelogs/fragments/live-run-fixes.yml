bugfixes:
  - >-
    ``vault_keys2_save`` rejected every ``patch`` and ``create_version`` task.
    Both operations forbade the ``algorithm`` parameter, which carries
    ``default="aes"`` in the argument spec and is therefore always supplied by
    AnsibleModule, so two of the module's three operations could never run.
  - >-
    ``usermgmt_users_save`` rejected every task. ``allowed_auth_methods`` is a
    list defaulting to ``["password"]``, and the module compared the whole list
    against scalar choices, so validation always failed. The choices are now
    declared on the argument spec, where Ansible validates each element.
  - >-
    ``cm_certificate_authority`` with ``op_type: create`` silently created
    nothing. CipherTrust Manager ignores the ``cn`` filter on its local-CA
    listing and returns the first CA in the collection, which the
    GET-before-write lookup accepted as an existing match. A lookup result is
    now only accepted when the resource confirms the field that was filtered
    on, so an unverifiable answer no longer turns a create into a silent no-op.
  - >-
    ``op_type: patch`` reported ``changed`` on every run for any module with
    defaulted parameters. CipherTrust Manager omits fields such as
    ``allVersions`` from a GET, and a defaulted value the playbook never asked
    for was compared as a pending change. A defaulted value that CM does not
    report is no longer treated as a difference; a value the playbook did set
    is still applied.

minor_changes:
  - >-
    ``ThalesCipherTrustModule`` exposes ``argument_spec`` so the idempotency
    helpers can distinguish a value a playbook asked for from one the spec
    supplied.
  - >-
    The unit-test harness now applies argument-spec defaults the way
    AnsibleModule does. Without this, tests supplied only the parameters they
    passed, which is why two entirely unusable modules went unnoticed.
  - >-
    Added ``tests/unit/test_defaulted_parameter_rules.py``, which fails if any
    operation forbids a parameter that carries a default, or both requires and
    forbids the same parameter.
  - >-
    ``cm_certificate_authority`` documents that creating a local CA is not
    idempotent, because CipherTrust Manager's local-CA listing cannot be
    filtered by ``cn``.
