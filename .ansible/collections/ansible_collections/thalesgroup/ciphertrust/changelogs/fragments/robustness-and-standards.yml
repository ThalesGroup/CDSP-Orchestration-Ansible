minor_changes:
  - >-
    GET requests are now retried after a transient failure (429, 502, 503, 504
    or a connection error), with backoff. Writes are never replayed: a POST,
    PATCH or DELETE that may already have been applied fails the task instead.
  - >-
    An expired CipherTrust Manager session is now renewed transparently. A 401
    triggers one re-authentication and a single retry, so a session that
    expires earlier than the cached token lifetime no longer fails the task.
  - >-
    Every module now documents its check mode and diff mode support through
    the standard ``attributes`` documentation block.
  - >-
    ``meta/runtime.yml`` now defines an ``all`` action group, so a play can set
    shared connection parameters once via
    ``module_defaults: {group/thalesgroup.ciphertrust.all: {localNode: ...}}``.
    A unit test keeps the group in step with the modules on disk.
  - >-
    Added a CodeQL workflow running the ``security-extended`` query set on
    every push and pull request, and weekly.

bugfixes:
  - >-
    ``cm_resource_delete`` now reports a missing ``key`` in check mode as well
    as during a real run. Check mode short-circuited before the parameter was
    validated, so ``--check`` reported success for a task that could not run.
  - >-
    ``license_trial_get`` now reports a clear error when CipherTrust Manager
    has no trial licences, instead of raising ``IndexError``, and when a trial
    record is missing the fields it needs.
  - >-
    ``cm_cluster`` now validates the signing payload returned during a cluster
    join. It was parsed with ``ast.literal_eval`` and its fields read
    unguarded, so an unexpected response aborted the join with ``ValueError``
    or ``KeyError`` instead of a readable failure.
  - >-
    Corrected the README's Python requirement: the collection needs Python 3.9
    or later, matching ansible-core 2.15, not 3.7 as previously stated.
