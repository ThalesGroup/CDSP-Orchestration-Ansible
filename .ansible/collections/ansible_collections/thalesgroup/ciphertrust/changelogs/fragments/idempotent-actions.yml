minor_changes:
  - >-
    ``cm_resource_delete`` no longer reports a change, or fails, when the
    resource is already gone. It checks the URL the DELETE would target and
    reports ``changed=false`` if nothing is there, which makes a delete safe to
    re-run.
  - >-
    ``group_add_remove_object`` is now idempotent. Adding a user or client that
    is already a member, or removing one that is not, reports
    ``changed=false`` and sends no request.
  - >-
    Added ``resource_exists``, ``idempotent_add`` and ``idempotent_remove`` to
    ``module_utils/idempotent.py``. ``resource_exists`` answers present, absent
    or *undeterminable*; when CipherTrust Manager will not say, the operation
    is performed rather than silently skipped, so an inconclusive answer can
    never cause a task to do nothing.
  - >-
    ``cm_services``, ``cm_cluster``, ``interface_actions``, ``license_create``,
    ``license_trial_action`` and ``vault_keys2_op`` now document that
    ``changed`` reports that their operation was carried out rather than that
    CipherTrust Manager was altered. These operations have no state to compare
    against, so repeating the task reports ``changed`` again.
