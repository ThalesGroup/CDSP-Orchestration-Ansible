bugfixes:
  - >-
    Integration targets no longer assert a ``{"message": ...}`` envelope that
    CipherTrust Manager does not return. Create, patch and delete return the
    resource itself, so 15 targets were asserting a shape that never existed
    and failed on the conditional rather than on the operation.
  - >-
    Six integration targets carried unfilled ``<CM_IP_OR_FQDN>`` placeholders
    or referenced variables nothing defines (``integration_config.localNode``,
    ``timestamp``, ``name``); they now use the connection from
    ``integration_config.yml`` like the rest of the suite.
  - >-
    Targets creating a DPG protection policy now supply ``access_policy_name``,
    which the module requires for ``op_type: create``, and the protection
    policy target creates the access policy it references first.
  - >-
    The interface target no longer sends ``name`` when creating an interface,
    which CipherTrust Manager rejects, and removes the interface by name --
    ``DELETE configs/interfaces/<id>`` returns 404 on this API.

minor_changes:
  - >-
    ``module_license_create``, ``module_interface_actions`` and
    ``module_domain_save`` now skip with an explanation instead of failing when
    the site-specific data they need is not configured. ``module_domain_save``
    additionally requires ``cm_allow_uncleanable_tests``, because this
    collection cannot delete a domain and the test would leave one behind.
